[[toml]]
load-key-sh = "ETC=$PAGE_CONFIG_DIR langpath"
load-toml-sh = "menuadd $PAGE_CONFIG_DIR"

[[group]]
title-sh = """
[ -f $PAGE_CONFIG_DIR/lang/auto.bash ] && echo "@google_text"
"""
[[action]]
title = "@check_ufs_text"
summary = "{TEXT_ROOT}"
lock = "{LOT}|@fs_text_3"
script = "$PAGE_CONFIG_DIR/scrip/ufs.bash"

[[group]]
[[action]]
title = "@fs_text_2"
desc = "@fs_text_1"
summary = "{TEXT_ROOT}"
lock = "{LOT}|@fs_text_3"
script = """
echo "@fs_text_4"
echo
fstrim -v /vendor
fstrim -v /system
fstrim -v /system_ext
fstrim -v /product
fstrim -v /cache
fstrim -v /data
echo
echo "@fs_text_4 auto"
echo
sm fstrim
echo
checktime
"""
