required = true

[[action.params]]
name = "open_app_bool"
label = "@open_app_text_2"
type = "switch"
value = "true"

[[action.params]]
name = "dem_giay"
label = "@param2_label"
desc = "@param2_desc"
type = "seekbar"
min = 5
max = 300
value = 60

[[action.params]]
name = "kill_customize"
label = "@param3_label"
desc = "@param3_desc"
placeholder = "com.android.systemui"
type = "text"

