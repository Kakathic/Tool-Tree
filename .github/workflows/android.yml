name: Android CI

on:
  workflow_dispatch:
    inputs:
      UPAPK:
        description: 'Release APK'
        type: boolean
        default: false
      UPTG:
        description: 'Send Telegram'
        type: boolean
        default: false
  push:
    paths:
      - 'app/**'

permissions: write-all

env:
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  UPAPK: ${{ inputs.UPAPK }}
  UPTG: ${{ inputs.UPTG }}

jobs:
  build-release:
    if: ${{ github.repository_owner == 'Kakathic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Stable

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build APK
        run: |
          chmod +x ./.github/build.bash
          ./.github/build.bash
      - name: Beta APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Tool-Tree ${{ env.VER }} beta"
          tag_name: "beta"
          files: Beta/*
          prerelease: true

      - name: Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.UPAPK == true }}
        uses: softprops/action-gh-release@v2
        with:
          name: "Tool-Tree ${{ env.VER }}"
          tag_name: "V${{ env.VER }}"
          files: Up/*
          prerelease: false
          body_path: "change.txt"
