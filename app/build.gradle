apply plugin: 'com.android.application'

android {
    namespace "com.tool.tree"
    compileSdkVersion 37
    buildFeatures {
        viewBinding = true
        aidl = true
    }
    kotlin {
        jvmToolchain(21)
    }
    lint {
        // baseline = file("lint-baseline.xml")
        disable += ['ExpiredTargetSdkVersion']
        // abortOnError false
        // checkReleaseBuilds false
    }
    defaultConfig {
        resourceConfigurations += ['vi', 'ru', 'hu', 'es', 'id']
        minSdkVersion 24
        targetSdkVersion 28
        versionCode Integer.parseInt(new java.text.SimpleDateFormat("yyMMddHH").format(new Date()))
        // versionCode 26021101
        versionName "1.6.0"
    }
    signingConfigs {
        release {
            storeFile file("Kakathic.jks")
            storePassword System.getenv("KEY_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
            enableV3Signing true
        }
    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled = true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set(
                "Tool-Tree_${output.versionName.get()}_" +
                "${output.versionCode.get()}_" +
                "${variant.name}.apk"
            )
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "androidx.core:core:1.19.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.webkit:webkit:1.17.0"
    implementation "org.tomlj:tomlj:1.1.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
repositories {
    google()
    mavenCentral()
}

