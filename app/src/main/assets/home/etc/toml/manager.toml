[[group]]
[[menu]]
[[menu.items]]
title = "Hướng dẫn TOML"
link = "https://kakathic.github.io/Tool-Tree/website/Toml-html.html"
[[menu.items]]
title = "Trình tạo mã TOML"
link = "https://kakathic.github.io/Tool-Tree/website/Toml-generator.html"

[[group]]
[[action]]
title = "Dự án add-on"
menu = true
show = true
shell = "hidden"
warn = """
Tài khoản có tác dụng là khi bạn upload add-on lên kho, nếu khớp tài khoản lần đầu upload, add-on sẽ được phép cập nhật, nếu sai tài khoản nó sẽ bị bỏ qua.
Lưu ý: Không được dùng tên tác giả add-on giống với tên tài khoản, nếu người khác dùng tên tài khoản của bạn, họ có thể thay đổi add-on của bạn.
"""

[[action.params]]
name = "account_add_on"
label = "Tài khoản"
desc = "Nó giống như một loại mã để phân biệt, khi update add-on"
type = "text"
required = true

[[action.params]]
name = "list_add_on"
desc = "Lựa chọn hoặc tạo mới id của add-on"
label = "Nhập tên"
type = "single-select"
options-sh = "findfile for $UZZ"
required = true
editable = true

[[group]]
[[action]]
title = "Tạo Add-on.bash"

[[action.params]]
name = "addon_name_id"
label = "Tên id"
desc = "Tự động lấy tên dự án hiện tại làm id"
type = "text"
readonly = true

[[action.params]]
name = "addon_name"
title = "Nhập Tên add-on"
label = "Tên add-on"
type = "text"
required = true
placeholder = "Test"

[[action.params]]
name = "addon_author"
title = "Nhập Tên tác giả"
label = "Tên tác giả"
type = "text"
required = true
placeholder = "Kakathic"

[[action.params]]
name = "addon_descss"
title = "Nhập mô tả tính năng"
label = "Mô tả"
type = "text"
required = true
placeholder = "Test zzz"

[[action.params]]
name = "addon_version"
title = "Nhập phiên bản"
label = "Phiên bản"
type = "number"
required = true
placeholder = "1.0"

[[action.params]]
name = "addon_code_version"
title = "Nhập code phiên bản"
label = "Mã phiên bản"
type = "number"
required = true
placeholder = 100

[[action.params]]
name = "addon_root"
title = "sử dụng quyền root"
label = "Root để sử dụng"
desc = "Thiết bị không root sẽ bị giới hạn, không thể sử dụng add-on"
type = "switch"
required = true

[[editor]]
title = "Sửa index.bash"
file = "test.toml"
lock-sh = """
test -f $ETC/toml/test.toml && echo 0 || echo "Mở kiểm thử mã TOML trước"
"""

[[group]]
[[page]]
title = "Quản lý add-on"
icon = "add_online.png"
process = true
config-sh = "$ETC/tool-tree.bash Addon $UZZ"
