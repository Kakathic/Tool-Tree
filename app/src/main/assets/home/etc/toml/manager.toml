[[toml]]
load-key-sh = "langpath"

[[group]]
[[menu]]
[[menu.items]]
title = "@guide_title"
link = "https://kakathic.github.io/Tool-Tree/website/Toml.html"
[[menu.items]]
title = "@gen_title"
link = "https://kakathic.github.io/Tool-Tree/website/Toml-generator.html"
[[menu.items]]
title = "@approval_history_text"
type = "action"
script = """
  log_check="$(xem "https://github.com/Kakathic/Tool-Tree/releases/download/V1/addon.log")"
  idss="$(glog id_add_on)"
  if echo "$log_check" | grep -q "$idss:"; then
  echo "$log_check" | grep "$idss:"
  else
  echo "$log_check"
  fi
"""

[[group]]
[[action]]
title = "@project_addon_title"
menu = true
reload = true
show = '[ -z "$(glog id_add_on)" ] && echo 1 || echo 0'
warn = "@project_addon_warn"
shell = "hidden"
shell-by = "addon_features_toml"
shell-value = "2,3,4"
shell-mode = "log"
script = '''
  slog id_add_on "$id_add_on"
  slog account_add_on "$account_add_on"
  mkdir -p "$UZZ/$id_add_on"
  upaddon
'''

[[action.params]]
name = "addon_features_toml"
title = "@title_addon_features"
label = "@option_text"
type = "single-select"
items = ["1|@default_text", "2|@pack_text", "3|@upload_online_text", "4|@delete_online_text"]
readonly = '[ -z "$(glog id_add_on)" ] && echo 1'
remember = false

[[action.params]]
name = "account_add_on"
title = "@secret_code_title"
type = "password"
required = true
placeholder = "Kakathic_test_1234"

[[action.params]]
name = "id_add_on"
title = "@list_addon_desc"
label = "@input_name_label"
type = "single-select"
options-sh = "findfile for $UZZ"
value-sh = "glog id_add_on"
required = true
editable = true
placeholder = "test_addon"

[[group]]
[[action]]
title = "@create_addon_title"
reload = true
shell = "hidden"
icon = "{ICON}/create_addon.png"
script = '''
slog addon_type_toml "$addon_type_toml"
id_addons="$(glog id_add_on)"
[ "$addon_root" == 1 ] && addon_root_bl=true || addon_root_bl=false
[ -f "$addon_icon_path" ] && cp -rf "$addon_icon_path" "$UZZ/$id_addons/icon.png"
if [ -f "$UZZ/$id_addons/Add-on.bash" ]; then
sed -i \
  -e "s/^name=.*/name=\"$addon_name\"/" \
  -e "s/^author=.*/author=\"$addon_author\"/" \
  -e "s/^version=.*/version=\"$addon_version\"/" \
  -e "s/^description=.*/description=\"$addon_descss\"/" \
  -e "s/^versionCode=.*/versionCode=\"$addon_code_version\"/" \
  -e "s/^root=.*/root=\"$addon_root_bl\"/" "$UZZ/$id_addons/Add-on.bash"
else
echo "# Add-on
id=$id_addons
name=\"$addon_name\"
author=\"$addon_author\"
version=\"$addon_version\"
description=\"$addon_descss\"
versionCode=\"$addon_code_version\"
root=\"$addon_root_bl\"" > "$UZZ/$id_addons/Add-on.bash"
fi
'''

[[action.params]]
name = "idsssss"
label = "@addon_id_label"
desc = "@addon_id_desc"
value-sh = "glog id_add_on"
type = "text"
readonly = true

[[action.params]]
name = "addon_name"
label = "@addon_name_label"
type = "text"
required = true
placeholder = "Test"
value-sh = '''
source "$UZZ/$(glog id_add_on)/Add-on.bash"
echo "$name"
'''

[[action.params]]
name = "addon_author"
label = "@addon_author_label"
type = "text"
required = true
placeholder = "Kakathic"
value-sh = '''
source "$UZZ/$(glog id_add_on)/Add-on.bash"
echo "$author"
'''

[[action.params]]
name = "addon_descss"
label = "@addon_desc_label"
type = "text"
required = true
placeholder = "Test zzz"
value-sh = '''
source "$UZZ/$(glog id_add_on)/Add-on.bash"
echo "$description"
'''

[[action.params]]
name = "addon_version"
label = "@addon_version_label"
type = "number"
required = true
placeholder = "1.0"
value-sh = '''
source "$UZZ/$(glog id_add_on)/Add-on.bash"
echo "$version"
'''

[[action.params]]
name = "addon_code_version"
label = "@addon_code_version_label"
type = "number"
required = true
placeholder = 100
value-sh = '''
source "$UZZ/$(glog id_add_on)/Add-on.bash"
echo "$versionCode"
'''

[[action.params]]
name = "addon_root"
label = "@addon_root_label"
desc = "@addon_root_desc"
type = "switch"
required = true
value-sh = '''
source "$UZZ/$(glog id_add_on)/Add-on.bash"
echo "$root"
'''

[[action.params]]
name = "addon_type_toml"
label = "@addon_type_index"
type = "single-select"
items = ["toml", "bash"]

[[action.params]]
name = "addon_icon_path"
label = "Icon add-on"
type = "file"
suffix = "png"

[[editor]]
title = "@edit_index_title"
run = false
icon = "{ICON}/edit_index.png"
file-sh = '''
echo "$UZZ/$(glog id_add_on)/index.$(glog addon_type_toml toml)"
'''
placeholder = '''# toml
[[toml]]
[[group]]
title = "Hello"

# bash
home (){
  echo '
  [[toml]]
  [[group]]
  title = "Hello"
  '
}
'''

[[group]]
[[page]]
title = "@manage_addon_title"
icon = "{ICON}/manage_addon.png"
process = true
config-sh = "exec $ETC/add-on.bash $UZZ"

[[group]]
[[editor]]
id = "shella"
title = "@home_text_5"
desc = "@home_text_6"
icon = "{ICON}/shella.png"
file = "{HOME}/usr/run_shellb.bash"
need-input = true
placeholder = "#bash|sh|python"
value = """# bash
"""
