[[toml]]
load-key-sh = "langpath"

[[group]]
columns = true
card = true
widget = false
[[page]]
title = "@guide_title"
icon = "{ICON}/guidebook.png"
link = "https://kakathic.github.io/Tool-Tree/website/Toml.html"
cell = "a"
[[page]]
title = "@gen_title"
icon = "{ICON}/test_genera.png"
link = "https://kakathic.github.io/Tool-Tree/website/Toml-generator.html"
cell = "b"

[[group]]
[[editor]]
title = "@editor_title"
icon = "{ICON}/test_edit.png"
file = "test.toml"
placeholder = "[[toml]]"
value = """# toml
[[group]]
[[switch]]
title = "Test switch"
get = "glog test_log_nut"
set = "slog test_log_nut $state"
"""

[[group]]
[[page]]
title = "Demo TOML"
icon = "{ICON}/documents.png"
config = "{HOME}/etc/demo/index.toml"

[[group]]
[[editor]]
id = "shella"
title = "@home_text_5"
desc = "@home_text_6"
icon = "{ICON}/shell.png"
file = "{HOME}/usr/run_shella.bash"
need-input = true
placeholder = "#bash|sh|python"
value = """# bash
"""
