[[toml]]
load-key-sh = "langpath"

[[group]]
[[page]]
title = "@guide_title"
desc = "@guide_desc"
icon = "🔥"
link = "https://kakathic.github.io/Tool-Tree/website/Toml-html.html"
[[page]]
title = "@gen_title"
desc = "@gen_desc"
icon = "🔥"
link = "https://kakathic.github.io/Tool-Tree/website/Toml-generator.html"

[[group]]
[[editor]]
title = "@editor_title"
desc = "@editor_desc"
icon = "⚙️"
file = "test.toml"
placeholder = "[[toml]]"
value = """
[[group]]
[[switch]]
title = "Test switch"
get = "glog test_log_nut"
set = "slog test_log_nut $state"
"""

[[group]]
[[page]]
title = "@check_title"
config = "test.toml"
lock-sh = """
[ -f $ETC/toml/test.toml ] && echo 0 || echo "@lock_msg"
"""
