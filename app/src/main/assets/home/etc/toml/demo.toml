[[toml]]
load-key-sh = "langpath"

[[group]]
[[page]]
title = "@guide_title"
icon = "{ICON}/guidebook.png"
link = "https://kakathic.github.io/Tool-Tree/website/Toml.html"
[[page]]
title = "@gen_title"
icon = "{ICON}/test_genera.png"
link = "https://kakathic.github.io/Tool-Tree/website/Toml-generator.html"

[[group]]
[[editor]]
title = "@editor_title"
icon = "{ICON}/test_edit.png"
file = "test.toml"
placeholder = "[[toml]]"
value = """
[[group]]
[[switch]]
title = "Test switch"
get = "glog test_log_nut"
set = "slog test_log_nut $state"
"""

[[group]]
[[page]]
title = "@check_title"
config = "test.toml"
icon = "{ICON}/test_addon.png"
lock-sh = """
[ -f $ETC/toml/test.toml ] && echo 0 || echo "@lock_msg"
"""

[[group]]
[[editor]]
id = "shella"
title = "@home_text_5"
desc = "@home_text_6"
icon = "{ICON}/shella.png"
file = "{HOME}/usr/run_shella.bash"
need-input = true
placeholder = "#bash|sh|python"
value = """# bash
"""
