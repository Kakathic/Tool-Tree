[[toml]]
load-key-sh = "langpath"

[[group]]
[[page]]
title = "@setting_text_1"
desc = "@setting_text_2"
icon = "{ICON}/info.png"
config = "{HOME}/etc/toml/update.toml"

[[group]]
[[page]]
title = "@setting_text_7"
desc = "@setting_text_8"
icon = "{ICON}/feature.png"
config = "{HOME}/etc/toml/feature.toml"

[[group]]
[[page]]
title = "@addon_text"
desc = "@addon_desc"
icon = "{ICON}/test_addon.png"
config = "{HOME}/etc/toml/addon.toml"
support = "glog Toff"

[[group]]
[[picker]]
title = "@permis_text_2"
desc = "@permis_text_5"
icon = "{ICON}/language.png"
items = [ "|@default_text", "ai|Gemini AI", "en|English", "vi|Việt nam", "ru|Русский", "hu|Hungarian", "id|Indonesia", "es|Spanish" ]
get = "glog language_kkts"
set = """
if [ "$state" == "ai" ]; then
  if transai -c; then
    slog language_kkts "$state"
    auto_trans
    echo "exit:[restart]"
    exit
  else
  echo
  echo "@warn_gemini_text" >&2
  fi
else
  slog language_kkts "$state"
  [ -f $ETC/lang/auto.sh ] && rm -fr $ETC/lang/auto.sh
  slog language "$state"
  echo "exit:[restart]"
  exit
fi
"""

[[group]]
[[chat]]
id = "chatbot"
icon = "{ICON}/chatai.png"
title = "Chatbot AI"
desc = "@chat_gemini_text"
chat-title = "Chatbot"
user-title = "Bạn"
placeholder = "Nhập tin nhắn…"
max-lines = 8
markdown = true
greeting = "Xin chào tôi có thể giúp gì cho bạn?"
script = '''
chatbot --all --markdown --progress --stream --lang "$chatai_lang" --model "$ai_models" --provider "$list_provider" --instruction "$chatai_nextrule" --thinking "$models_thinking" --memory-file "$HOME/.cache/$CHAT_ID.sql" -p "$MSG"
'''

[[chat.menu]]
title = "Xoá bộ nhớ chatbot"
type = "clear"
silent = true
script = '''
rm -f "$HOME/.cache/$CHAT_ID.sql" 2>/dev/null
'''

[[chat.menu]]
title = "Tạo API key"
script = '''
echo "Đăng ký API KEY chính thức tại website sau:"
echo
chatbot --list-websites
'''

[[chat.menu]]
title = "Danh sách model"
script = '''
chatbot --list-models
'''

[[chat.params]]
name = "chatai_lang"
title = "@permis_text_5"
label = "@permis_text_2"
placeholder = "en-US"
type = "text"
value-sh = 'echo "$LANGUAGE-$COUNTRY"'

[[chat.params]]
name = "list_provider"
placeholder = "gemini"
title = "Chọn nhà cung cấp"
label = "Provider"
items = [ "gemini|Gemini", "openai", "openrouter", "groq", "together", "custom" ]
value = "gemini"

[[chat.params]]
name = "ai_models"
placeholder = "gemini-3.5-flash-lite"
title = "Models API"
desc = "Có thể sửa thành model khác"
editable = true
label = "Models"
items = [ "gemini-3.5-flash-lite", "free" ]
value-sh = "gemini-3.5-flash-lite"

[[chat.params]]
name = "models_thinking"
title = "@chatai_think_text"
label = "@option_text"
items = [ "auto|@default_text", "low", "medium", "high" ]
value = "auto"

[[chat.params]]
name = "chatai_nextrule"
title = "@chatai_rule_text"
placeholder = "- Always return text in uppercase"
type = "text"
max-lines = 6

[[group]]
[[terminal]]
id = "terminal"
title = "Terminal"
desc = "@home_text_6"
icon = "{ICON}/shella.png"
cwd = "{HOME}"
root = true
cmd = '''echo 'Welcome to Tool-Tree

Type the command:

- env
- java
- python

See more in bin and termux/bin.'
'''
font-size = 14
