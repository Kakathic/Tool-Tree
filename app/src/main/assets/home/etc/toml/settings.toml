[[toml]]
load-key-sh = "langpath"

[[group]]
[[page]]
title = "@setting_text_1"
desc = "@setting_text_2"
icon = "{ICON}/info.png"
config = "{HOME}/etc/toml/update.toml"

[[group]]
[[page]]
title = "@setting_text_7"
desc = "@setting_text_8"
icon = "{ICON}/feature.png"
config = "{HOME}/etc/toml/feature.toml"

[[group]]
[[page]]
title = "@addon_text"
desc = "@addon_desc"
icon = "{ICON}/test_addon.png"
config = "{HOME}/etc/toml/addon.toml"
support = "glog Toff"

[[group]]
[[picker]]
title = "@permis_text_2"
desc = "@permis_text_5"
icon = "{ICON}/language.png"
items = [ "|@default_text", "ai|AI Trans", "en|English", "vi|Tiếng Việt", "ru|Русский", "hu|Magyar", "id|Bahasa Indonesia", "es|Español", "zh|中文" ]
get = "glog language_kkts"
set = """
if [ "$state" == "ai" ]; then
  if transai -c; then
    slog language_kkts "$state"
    auto_trans
    echo "exit:[restart]"
    exit
  else
  echo
  echo "@warn_gemini_text" >&2
  fi
else
  slog language_kkts "$state"
  [ -f $ETC/lang/auto.sh ] && rm -fr $ETC/lang/auto.sh
  slog language "$state"
  echo "exit:[restart]"
  exit
fi
"""

[[group]]
[[chat]]
id = "chatbot"
icon = "{ICON}/chatai.png"
title = "@chatai_title"
desc = "@chat_gemini_text"
chat-title = "AI agent"
user-title = "@user_title"
placeholder = "@chat_placeholder"
show = true
max-lines = 8
markdown = true
greeting = "@chat_greeting"
script = '''
ai_agent --all --any-path --markdown --progress \
--lang "$chatai_lang" --model "$ai_models" \
--provider "$list_provider" --instruction "$chatai_nextrule" \
--thinking "$models_thinking" \
--memory-file "$HOME/.cache/$CHAT_ID.sql" \
--progress-single "$chatai_detail" -p "$MSG"
'''
params-shell = "hidden"
params-script = '''
slog list_provider $list_provider
alog list_ai_models $ai_models
'''

[[chat.menu]]
title = "@clear_chat_title"
type = "clear"
silent = true
script = '''
rm -f "$HOME/.cache/$CHAT_ID.sql" 2>/dev/null
rm -f "$HOME/.cache/actions.log" 2>/dev/null
rm -f "$HOME/.cache/api.log" 2>/dev/null
'''

[[chat.menu]]
title = "@api_website_title"
script = '''
ai_agent --list-websites
'''

[[chat.menu]]
title = "@model_list_title"
script = '''
ai_agent --provider "$(glog list_provider)" --list-models
'''

[[chat.params]]
name = "chatai_lang"
title = "@reply_lang_title"
label = "@permis_text_2"
placeholder = "en-US"
type = "text"
value-sh = 'echo "$LANGUAGE-$COUNTRY"'

[[chat.params]]
name = "list_provider"
placeholder = "gemini"
title = "@select_provider_title"
label = "Provider"
items = [ "gemini|Gemini", "openai|Openai", "openrouter|Openrouter", "groq|Groq", "together|Together", "deepseek|Deepseek" ]
value-sh = "glog list_provider gemini"

[[chat.params]]
name = "ai_models"
title = "@api_model_title"
desc = "@api_model_desc"
editable = true
label = "Models"
options-sh = "glog list_ai_models"
value = "gemini-3.5-flash-lite"

[[chat.params]]
name = "chatai_detail"
label = "@detail_label"
type = "switch"

[[chat.params]]
name = "models_thinking"
title = "@chatai_think_text"
label = "@option_text"
items = [ "auto|@auto_text", "low|@low_text", "medium|@medium_text", "high|@high_text" ]
value = "auto"

[[chat.params]]
name = "chatai_nextrule"
title = "@chatai_rule_text"
placeholder = "@rule_placeholder"
type = "text"
max-lines = 6

[[chat.params]]
name = "chatai_advanced"
label = "@api_other_label"
type = "switch"
title = "@advanced_features_text"

[[chat.params]]
name = "API_KEY"
label = "API-Key"
type = "password"
depend = "chatai_advanced"
depend-value = "1"
depend-default = "hide"
depend-include-hidden = "false"

[[chat.params]]
name = "API_URL"
label = "API-Url"
type = "text"
depend = "chatai_advanced"
depend-value = "1"
depend-default = "hide"
depend-include-hidden = "false"

[[group]]
[[terminal]]
id = "terminal"
title = "@terminal_title"
desc = "@home_text_6"
icon = "{ICON}/shella.png"
cwd = "{HOME}"
root = true
cmd = '''echo "Welcome to Tool-Tree

Type the command:

- env
- java
- python

See more in bin and termux/bin."
'''
font-size = 14
