title = "@setting_text"
icon = "{ICON}/settings.png"
config = "{HOME}/etc/toml/settings.toml"
support = "glog Toff"

[[page]]
title = "@tools_text"
icon = "{ICON}/tool_apk.png"
config = "{HOME}/etc/toml/troot.toml"

