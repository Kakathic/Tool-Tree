[[toml]]
load-key-sh = "langpath"

[[group]]
[[menu]]
handler = """
if [ "$menu_id" == "v1" ]; then
echo "am:[start -a android.settings.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS -d package:com.tool.tree]"
elif [ "$menu_id" == "v2" ]; then
echo "am:[start -a android.settings.MANAGE_APP_ALL_FILES_ACCESS_PERMISSION -d package:com.tool.tree]"
elif [ "$menu_id" == "v3" ]; then
echo "am:[start -a android.settings.APPLICATION_DETAILS_SETTINGS -d package:com.tool.tree]"
fi
"""
[[menu.items]]
key = "v1"
title = "@permis_text_1"
silent = true
[[menu.items]]
key = "v2"
title = "@permis_text_4"
silent = true
[[menu.items]]
key = "v3"
title = "@setting_text_5"
silent = true

[[group]]
[[text]]
[[text.rows]]
html-file = "{HOME}/etc/html/tool-tree.html"
html-height = 100

[[group]]
columns = true
card = true
widget = false
[[page]]
title = "@update_text_5"
icon = "{ICON}/website.png"
link = "https://Kakathic.github.io/Tool-Tree"
cell = "a"
[[page]]
title = "Telegram"
icon = "{ICON}/telegram.png"
link = "https://t.me/tooltree"
cell = "b"

[[group]]
[[download]]
title = "@download_text stable"
icon = "{ICON}/update.png"
url-sh = """
if unzip -l "$PATH_APK" | grep -q "assets/module"; then
linkgit https://api.github.com/repos/Kakathic/Tool-Tree/releases/latest Tool-Tree-offline | head -n 1
else
linkgit https://api.github.com/repos/Kakathic/Tool-Tree/releases/latest Tool-Tree | grep -v offline | head -n 1
fi
"""
script = "openfile $state"

[[group]]
[[download]]
title = "@download_text beta"
icon = "{ICON}/update2.png"
url-sh = """
if unzip -l "$PATH_APK" | grep -q "assets/module"; then
echo "https://github.com/Kakathic/Tool-Tree/releases/download/beta/Tool-Tree-offline-beta.apk"
else
echo "https://github.com/Kakathic/Tool-Tree/releases/download/beta/Tool-Tree-beta.apk"
fi
"""
script = "openfile $state"
