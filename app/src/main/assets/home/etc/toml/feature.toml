[[toml]]
load-key-sh = "langpath"

[[group]]
[[switch]]
title = "@project_text_5"
icon = "{ICON}/set_home.png"
shell = "hidden"
auto-restart = true
get = "glog Tset"
set = "slog Tset $state"

[[switch]]
title = "@project_text_7"
icon = "{ICON}/icon_off.png"
shell = "hidden"
auto-restart = true
get = "glog Ticon"
set = "slog Ticon $state"

[[switch]]
title = "@project_text_16"
icon = "{ICON}/layout.png"
shell = "hidden"
auto-restart = true
get = "glog Toff"
set = "slog Toff $state"

[[group]]
[[action]]
title = "@project_text_12"
icon = "{ICON}/cpu.png"
warn = "@project_text_13"
shell = "hidden"
support = "command -v taskset &>/dev/null && echo 1"
script = "slog use_cpu $use_cpus"

[[action.params]]
name = "use_cpus"
label = "@option_text"
value-sh = "glog use_cpu"
options-sh = "seq 1 $(nproc --all)"

[[group]]
[[action]]
title = "@project_text_10"
icon = "{ICON}/java.png"
warn = "@project_text_9"
shell = "hidden"
script = "slog ramoccupied $ramoccupied"

[[action.params]]
name = "ramoccupied"
label = "@option_text"
value-sh = "glog ramoccupied 4096"
items = [ "512", "1024", "2048", "3072", "4096", "5120", "6144", "7168", "8192" ]

[[group]]
[[action]]
id = "gemini_api"
title = "@api_key_text"
icon = "{ICON}/apikey.png"
script = '''
[ "$GEMINI_API_KEY" ] && list_provider=gemini ai_agent -c
[ "$OPENAI_API_KEY" ] && list_provider=openai ai_agent -c
[ "$OPENROUTER_API_KEY" ] && list_provider=openrouter ai_agent -c
[ "$GROQ_API_KEY" ] && list_provider=groq ai_agent -c
[ "$TOGETHER_API_KEY" ] && list_provider=together ai_agent -c
[ "$DEEPSEEK_API_KEY" ] && list_provider=deepseek ai_agent -c
'''

[[action.params]]
name = "GEMINI_API_KEY"
label = "Gemini"
placeholder-sh = "list_provider=gemini ai_agent --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "OPENAI_API_KEY"
label = "Openai"
placeholder-sh = "list_provider=openai ai_agent --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "OPENROUTER_API_KEY"
label = "Openrouter"
placeholder-sh = "list_provider=openrouter ai_agent --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "GROQ_API_KEY"
label = "Groq"
placeholder-sh = "list_provider=groq ai_agent --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "TOGETHER_API_KEY"
label = "Together"
placeholder-sh = "list_provider=together ai_agent --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "DEEPSEEK_API_KEY"
label = "Deepseek"
placeholder-sh = "list_provider=deepseek ai_agent --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
type = "rows"
[[action.params.rows]]
text-sh = "ai_agent --list-websites"
margin-top = 8
line = true

[[group]]
[[action]]
title = "@trans_custom_title"
icon = "{ICON}/translation.png"
script = '''
slog ai_models_trans "$ai_models_trans"
slog transai_lang "$transai_lang"
slog transai_hd "$transai_hd"
slog list_provider_trans "$list_provider_trans"
transai -p "$transai_demo"
'''

[[action.params]]
name = "transai_lang"
title = "@reply_lang_title"
label = "@permis_text_2"
placeholder = "en-US"
type = "text"
value-sh = 'glog transai_lang "$LANGUAGE-$COUNTRY"'

[[action.params]]
name = "list_provider_trans"
title = "@select_provider_title"
label = "Provider"
items = [ "gemini|Gemini", "openai|Openai", "openrouter|Openrouter", "groq|Groq", "together|Together", "deepseek|Deepseek" ]
value-sh = "glog list_provider_trans gemini"

[[action.params]]
name = "ai_models_trans"
title = "@select_provider_title"
editable = true
label = "Models"
items = [ "gemini-3.1-flash-lite" ]
value-sh = "glog ai_models_trans gemini-3.1-flash-lite"

[[action.params]]
name = "transai_hd"
title = "@trans_guide_title"
type = "text"
max-lines = 6
value-sh = "glog transai_hd"

[[action.params]]
name = "transai_demo"
title = "@trans_demo_title"
type = "text"
value = "Hello world !"
max-lines = 6
