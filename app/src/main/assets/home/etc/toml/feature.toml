[[toml]]
load-key-sh = "langpath"

[[menu]]
[[menu.items]]
link = "https://aistudio.google.com/api-keys"
title = "@generate_text Gemini API"
silent = true

[[group]]
[[switch]]
title = "@project_text_5"
icon = "{ICON}/set_home.png"
shell = "hidden"
auto-restart = true
get = "glog Tset"
set = "slog Tset $state"

[[switch]]
title = "@project_text_7"
icon = "{ICON}/icon_off.png"
shell = "hidden"
auto-restart = true
get = "glog Ticon"
set = "slog Ticon $state"

[[group]]
[[action]]
title = "@project_text_12"
icon = "{ICON}/cpu.png"
warn = "@project_text_13"
shell = "hidden"
support = "command -v taskset &>/dev/null && echo 1"
script = "slog use_cpu $use_cpus"

[[action.params]]
name = "use_cpus"
label = "@option_text"
value-sh = "glog use_cpu"
options-sh = "seq 1 $(nproc --all)"

[[group]]
[[action]]
title = "@project_text_10"
icon = "{ICON}/java.png"
warn = "@project_text_9"
shell = "hidden"
script = "slog ramoccupied $ramoccupied"

[[action.params]]
name = "ramoccupied"
label = "@option_text"
value-sh = "glog ramoccupied 4096"
items = [ "512", "1024", "2048", "3072", "4096", "5120", "6144", "7168", "8192" ]

[[group]]
[[action]]
id = "gemini_api"
allow-shortcut = false
title = "@api_key_text"
icon = "{ICON}/apikey.png"
script = '''
slog ai_models "$ai_models"
chatbot -c
echo
echo -e "\033[32mList of websites to register for API\033[0m"
chatbot --list-websites --lang "$LANGUAGE-$COUNTRY"
echo
echo -e "\033[32mList of current supplier models\033[0m"
chatbot --list-models --lang "$LANGUAGE-$COUNTRY"
'''

[[action.params-rows]]
#text-sh = "chatbot --list-websites"
line = true

[[action.params]]
name = "GEMINI_API_KEY"
label = "Gemini API"
placeholder-sh = "list_provider=gemini chatbot --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "OPENAI_API_KEY"
label = "Openai API"
placeholder-sh = "list_provider=openai chatbot --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "OPENROUTER_API_KEY"
label = "Openroute API"
placeholder-sh = "list_provider=openrouter chatbot --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "GROQ_API_KEY"
label = "Groq API"
placeholder-sh = "list_provider=groq chatbot --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "TOGETHER_API_KEY"
label = "Together API"
placeholder-sh = "list_provider=together chatbot --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "CUSTOM_API_KEY"
label = "Custom API"
placeholder-sh = "list_provider=custom chatbot --show 2>/dev/null"
type = "password"
remember = false

[[action.params]]
name = "list_provider"
placeholder = "gemini"
title = "Chọn nhà cung cấp"
label = "Provider"
items = [ "gemini", "openai", "openrouter", "groq", "together", "custom" ]
value = "gemini"

[[action.params]]
name = "ai_models"
placeholder = "gemini-3.1-flash-lite"
title = "Models API"
editable = true
label = "Models"
items = [ "gemini-3.5-flash-lite", "free" ]
value-sh = "glog ai_models gemini-3.5-flash-lite"
