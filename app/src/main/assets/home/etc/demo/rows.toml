# app/src/main/assets/home/etc/demo/rows.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[text]]
[[text.rows]]
sh = 'echo "${PAGE_CONFIG_FILE:-$ETC/demo/rows.toml}"'
monospace = true
size = 11
alpha = 0.7
copy = true
[[text.rows]]
line = true

[[group]]
title = "@rw_001"
[[text]]
[[text.rows]]
sh = "date '+@rw_002 %H:%M:%S'"
[[text.rows]]
text = "@rw_003"
sh = "echo @rw_004 $(getprop ro.product.model)"
break = true

[[group]]
title = "@rw_005"
[[text]]
[[text.rows]]
sh = "date '+@rw_006 %H:%M:%S'"
[[text.rows]]
text = "@rw_007"
align = "right"
reset = 0
underline = true
[[text.rows]]
text = "@rw_008"
sh = "date '+@rw_009 %S @rw_010'"
reset = "self"
underline = true
break = true
[[text.rows]]
text = "@rw_011"
reset = "all"
underline = true
break = true
[[text.rows]]
text = "@rw_012"
script = 'echo "@rw_013"'
toast = true
reset = 0
underline = true
break = true

[[group]]
title = "@rw_014"
[[text]]
[[text.rows]]
text = "@rw_015"
progress = 60
progress-color = "#4CAF50"
[[text.rows]]
text = "@rw_016"
sh = "df -h /data | tail -1 | awk '{print $5}'"
progress-sh = '''df /data | tail -1 | awk '{gsub("%",""); print $5}' '''
progress-max = 100
progress-color = "#FF9800"
progress-track-color = "#33888888"
progress-width = 140
progress-height = 8
break = true
[[text.rows]]
text = "@rw_017"
align = "right"
reset = "all"
underline = true
break = true

[[group]]
title = "@rw_018"
[[text]]
[[text.rows]]
sh = "date '+@rw_019 %H:%M:%S'"
refresh-interval = 5
refresh-bar = true
refresh-bar-color = "#0DBDA2"

[[group]]
title = "@rw_020"
[[text]]
[[text.rows]]
text = "@rw_021"
toggle = "switch"
get = "glog demo_row_switch"
set = 'slog demo_row_switch "$state"'
[[text.rows]]
text = "@rw_022"
toggle = "checkbox"
get = "glog demo_row_check"
set = 'slog demo_row_check "$state"'
toast = true
break = true
[[text.rows]]
text = "@rw_023"
toggle = "switch"
confirm-text = "@rw_024"
get = "glog demo_row_confirm"
set = 'slog demo_row_confirm "$state"'
break = true

[[group]]
title = "@rw_025"
[[text]]
[[text.rows]]
text = "@rw_026"
[[text.rows]]
text = "@rw_027"
support = "false"
break = true
[[text.rows]]
text = "@rw_028"
support = "echo 1"
break = true

[[group]]
title = "@rw_029"
[[text]]
[[text.rows]]
text = "@rw_030"
bold = true
[[text.rows]]
html-file = "{HOME}/etc/demo/demo.html"
html-height = 200
break = true

[[group]]
title = "@rw_031"
[[text]]
rows-sh = '''
cat << TOMLEND
[[rows]]
text = "@rw_032"
bold = true

[[rows]]
text = "@rw_033"
break = true
TOMLEND
'''
