# app/src/main/assets/home/etc/demo/group.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[text]]
[[text.rows]]
break = true
text = "@grp_001"
size = 12
alpha = 0.85
[[text.rows]]
line = true
[[text.rows]]
sh = 'echo "@path_toml ${PAGE_CONFIG_FILE:-$ETC/demo/group.toml}"'
