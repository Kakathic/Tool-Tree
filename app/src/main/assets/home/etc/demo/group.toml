size = 11
alpha = 0.7
copy = true

[[group]]
title = "@grp_002"
[[action]]
title = "@grp_003"
desc = "@grp_004"
script = 'echo "@grp_005"'
[[action]]
title = "@grp_006"
script = 'echo "@grp_007"'

[[group]]
