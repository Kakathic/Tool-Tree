# app/src/main/assets/home/etc/demo/chat.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[text]]
[[text.rows]]
sh = 'echo "${PAGE_CONFIG_FILE:-$ETC/demo/chat.toml}"'
monospace = true
size = 11
alpha = 0.7
copy = true
[[text.rows]]
line = true

[[group]]
title = "#1 @ch_001"
[[chat]]
title = "@ch_002"
desc = "@ch_003"
chat-title = "@ch_004"
user-title = "@ch_005"
greeting = "@ch_006"
placeholder = "@ch_007"
script = 'echo "@ch_008"'

[[group]]
title = "#2 @ch_009"
[[chat]]
title = "Chat Markdown"
desc = "@ch_010"
chat-title = "Bot Markdown"
user-title = "@ch_005"
markdown = true
max-lines = 4
greeting-sh = 'echo "@ch_011"'
script = '''
echo "@ch_012"
echo
echo "@ch_013 \`$CHAT_ID\`"
'''

[[group]]
title = "#3 @ch_014"
[[chat]]
title = "@ch_015"
desc = "@ch_016"
chat-title = "Shell helper"
user-title = "@ch_005"
markdown = true
greeting = "@ch_017"
params-title = "@ch_018"
params-shell = "hidden"
params-script = 'echo "MODE=$MODE"'
script = '''
echo "@ch_019"
sh -c "$MSG" 2>&1
'''
[[chat.params]]
name = "MODE"
title = "@act_030"
type = "spinner"
value = "safe"
items = ["@ch_020", "fast|Fast"]
[[chat.menu]]
title = "@ch_021"
type = "clear"
[[chat.menu]]
title = "@ch_022"
script = 'echo "@ch_023"'
silent = true
[[chat.menu]]
title = "@ch_024"
type = "close"
