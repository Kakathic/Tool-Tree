<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; margin: 12px; }
  h3 { margin: 0 0 6px; }
  p { margin: 4px 0; }
  button { padding: 6px 12px; }
</style>
</head>
<body>
  <h3 id="t"></h3>
  <p id="d"></p>
  <button id="b"></button>
  <p id="kq"></p>
<script>
  var vi = (navigator.language || '').toLowerCase().indexOf('vi') === 0;
  document.getElementById('t').textContent = vi ? 'Trang HTML nội tuyến' : 'Inline HTML page';
  document.getElementById('d').textContent = vi ? 'Khối này nằm trong một WebView bên dưới hàng văn bản.' : 'This block lives in a WebView below the text row.';
  var b = document.getElementById('b');
  b.textContent = vi ? 'Xem giờ' : 'Show time';
  b.onclick = function () { document.getElementById('kq').textContent = new Date().toLocaleTimeString(); };
</script>
</body>
</html>
