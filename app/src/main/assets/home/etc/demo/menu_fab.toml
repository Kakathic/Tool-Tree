# app/src/main/assets/home/etc/demo/menu_fab.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[text]]
[[text.rows]]
sh = 'echo "${PAGE_CONFIG_FILE:-$ETC/demo/menu_fab.toml}"'
monospace = true
size = 11
alpha = 0.7
copy = true
[[text.rows]]
line = true

[[group]]
title = "#1 @mf_001"
[[text]]
[[text.rows]]
text = "@mf_002"
[[text.rows]]
sh = "echo @mf_003 $(glog demo_menu_last)"
break = true
reset = "self"
underline = true

[[action]]
title = "@mf_004"
desc = "@mf_005"
menu = true
key = "demo_action_menu"
script = 'echo "@mf_006"'

[[menu]]
handler = 'slog demo_menu_last "$menu_id"; echo "Menu: $menu_id"'
[[menu.items]]
title = "@act_053"
type = "refresh"
[[menu.items]]
title = "@mf_007"
type = "checkbox"
get = "glog demo_menu_check"
script = 'slog demo_menu_check "$state"; echo "@mf_008"'
[[menu.items]]
title = "@mf_009"
type = "spinner"
items = ["@mf_010", "@mf_011", "@mf_012"]
get = "glog demo_menu_mode"
script = 'slog demo_menu_mode "$state"; echo "@mf_013"'
[[menu.items]]
title = "@mf_014"
[[menu.items]]
title = "@act_022"
script = 'slog demo_menu_last silent'
silent = true
[[menu.items]]
title = "@prm_049"
type = "file"
suffix = "txt,zip"
path-home = "/sdcard"
script = 'echo "@mf_015"'
[[menu.items]]
title = "@pg_001"
config = "{HOME}/etc/demo/switch.toml"
[[menu.items]]
title = "@mf_016"
link = "https://kakathic.github.io/Tool-Tree/website/Toml.html"
[[menu.items]]
title = "@mf_017"
type = "finish"

[[fab]]
[[fab.items]]
title = "@mf_018"
key = "demo_fab_add"
script = 'echo "@mf_019"'
fab-spin = true
[[fab.items]]
title = "@mf_020"
type = "file"
suffix = "txt"
script = 'echo "@dl_006"'
