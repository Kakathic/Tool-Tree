# app/src/main/assets/home/etc/demo/page.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[text]]
[[text.rows]]
sh = 'echo "${PAGE_CONFIG_FILE:-$ETC/demo/page.toml}"'
monospace = true
size = 11
alpha = 0.7
copy = true

[[group]]
title = "#1 @pg_001"
[[page]]
title = "@pg_002"
desc = "@pg_003"
config = "{HOME}/etc/demo/switch.toml"
[[page]]
title = "@pg_004"
desc = "@pg_005"
config = "text.toml"
[[page]]
title = "process = true"
desc = "@pg_006"
config = "{HOME}/etc/demo/picker.toml"
process = true
placeholder-count = 3

[[group]]
title = "#2 @pg_007"
[[page]]
title = "@pg_008"
desc = "@pg_009"
config-sh = '''
cat << 'TOMLEND'
[[toml]]

[[group]]
title = "#3 @pg_010"
[[text]]
[[text.rows]]
text = "@pg_011"
[[text.rows]]
sh = "date '+@pg_012 %H:%M:%S'"
[[action]]
title = "@pg_013"
script = 'echo "@pg_014"'
TOMLEND
'''
[[page]]
title = "@pg_015"
desc = "@pg_016"
config-sh = 'echo "$HOME/etc/demo/switch.toml"'

[[group]]
title = "#4 @pg_017"
[[page]]
title = "link"
desc = "@pg_018"
link = "https://kakathic.github.io/Tool-Tree/website/Toml.html"
[[page]]
title = "html"
desc = "@pg_019"
html = "https://kakathic.github.io/Tool-Tree/website/Toml.html"
[[page]]
title = "activity"
desc = "@pg_020"
activity = "android.settings.SETTINGS"

[[group]]
title = "#5 @pg_021"
[[page]]
title = "@pg_022"
desc = "@pg_023"
config = "{HOME}/etc/demo/switch.toml"
before-load = 'slog demo_page_event "before-load"'
after-load = 'slog demo_page_event "after-load"'
load-ok = 'slog demo_page_event "load-ok"'
load-fail = 'slog demo_page_event "load-fail"'
[[page]]
title = "@pg_024"
desc = "@pg_025"
config = "{HOME}/etc/demo/text.toml"
[[page.rows]]
text = "@pg_026"
italic = true
size = 12

[[group]]
title = "#6 @pg_027"
[[page]]
title = "@pg_028"
desc = "@pg_029"
lock = "@pg_030"
config = "{HOME}/etc/demo/switch.toml"
[[page]]
title = "min-sdk = 99"
desc = "@pg_031"
min-sdk = 99
config = "{HOME}/etc/demo/switch.toml"
[[page]]
title = "key"
desc = "@pg_032"
key = "demo_page_shortcut"
config = "{HOME}/etc/demo/switch.toml"
