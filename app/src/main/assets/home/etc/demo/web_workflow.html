<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web workflow</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2a2f3a;--text:#e6e8ec;--sub:#8b93a3;--acc:#4cc2ff;--ok:#3ddc84;--err:#ff5c6c;--warn:#ffc247;--skip:#6b7280}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--card2:#eef0f5;--line:#dfe3ea;--text:#1a1d24;--sub:#6b7280;--acc:#0a84d6;--ok:#17a255;--err:#d93a4a;--warn:#c98a00;--skip:#9aa1ad}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif;padding:12px 12px 96px}
.banner{font-size:12px;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.banner.mock{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.banner.real{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:var(--card);color:var(--sub);padding:9px;border-radius:12px;font-weight:600;font-size:13px}
.tabs button.on{background:var(--acc);color:#04202f}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
h2{font-size:15px;margin:0 0 8px}
small,.sub{color:var(--sub);font-size:12px}
.mono{font-family:ui-monospace,Menlo,monospace}
.time{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.progress{height:5px;background:var(--card2);border-radius:3px;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:transparent;color:var(--sub);padding:7px;border-radius:8px;font-size:12.5px;font-weight:600}.seg button.on{background:var(--acc);color:#04202f}
label.opt{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12.5px;margin:4px 0}.opt input{accent-color:var(--acc)}
.ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:var(--card2);color:var(--sub);border:2px solid var(--line)}
.ic[data-s=running]{border-color:var(--acc);color:var(--acc);border-top-color:transparent;animation:spin 1s linear infinite}
.ic[data-s=running] span{display:inline-block;animation:spin 1s linear infinite reverse}
.ic[data-s=ok]{background:var(--ok);border-color:var(--ok);color:#06210f}.ic[data-s=err]{background:var(--err);border-color:var(--err);color:#fff}
.ic[data-s=skip]{background:var(--skip);border-color:var(--skip);color:#fff}.ic[data-s=queue]{border-style:dashed}
@keyframes spin{to{transform:rotate(360deg)}}
.job{background:var(--card);border-radius:14px;margin-bottom:10px;border:1.5px solid transparent;overflow:hidden}
.job[data-s=running]{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}.job[data-s=err]{border-color:color-mix(in srgb,var(--err) 50%,transparent)}.job[data-s=skip]{opacity:.6}
.hd{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}.hd .n{flex:1;min-width:0}.hd b{display:block}
.chev{color:var(--sub);transition:transform .2s}.job.open .chev{transform:rotate(90deg)}
.jb{display:none;padding:0 12px 8px}.job.open .jb{display:block}
.sc{background:var(--card2);border-radius:10px;margin-bottom:8px;overflow:hidden}
.sh{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}.sh .n{flex:1;min-width:0}
.sh .n b{display:block;font-size:13px}.sh .n small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .ic{width:20px;height:20px;font-size:10px}
.log{display:none;background:#0a0c10;color:#c9d1d9;font:11.5px/1.5 ui-monospace,Menlo,monospace;padding:8px 10px;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.sc.open .log{display:block}.log .e{color:#ff7b86}.log .m{color:#7d8590}
input[type=text]{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:13px ui-monospace,Menlo,monospace}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;background:var(--card2);color:var(--text)}
.btn.p{background:var(--acc);color:#04202f}.btn.d{background:var(--err);color:#fff}.btn[disabled]{opacity:.4}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 12px 14px;background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:10px}.dock .btn{flex:1;padding:13px;font-size:15px}
pre.out{margin:8px 0 0;background:#0a0c10;color:#c9d1d9;border-radius:10px;padding:8px 10px;font:11.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto}
.hidden{display:none}
</style>
</head>
<body>
<div id="banner" class="banner"></div>
<div class="tabs"><button id="tabW" class="on"></button><button id="tabA"></button></div>

<!-- ===== Tab 1: workflow chạy shell thật ===== -->
<div id="paneW">
  <div class="card">
    <div class="row"><div class="ic" id="sIc">▶</div><div style="flex:1"><b id="sT"></b><div class="sub" id="sD"></div></div><span class="time" id="sTime">0.0s</span></div>
    <div class="progress"><i id="sBar"></i></div>
  </div>
  <div class="card">
    <div class="seg"><button id="mPar" class="on"></button><button id="mSeq"></button></div>
    <label class="opt"><input type="checkbox" id="oFail"><span id="oFailT"></span></label>
    <label class="opt"><input type="checkbox" id="oFF"><span id="oFFT"></span></label>
    <div class="row" style="margin-top:6px"><button class="btn" id="pick"></button><small class="mono" id="pickPath" style="word-break:break-all"></small></div>
  </div>
  <div id="jobs"></div>
</div>

<!-- ===== Tab 2: thử từng API của cầu nối ===== -->
<div id="paneA" class="hidden">
  <div class="card"><h2>rootCheck()</h2><div class="sub" id="aRootD"></div><button class="btn" id="aRoot" style="margin-top:8px"></button><pre class="out" id="aRootO"></pre></div>
  <div class="card"><h2>executeShell(script)</h2><div class="sub" id="aSyncD"></div>
    <input type="text" id="aSyncIn" value="echo $(id -un) @ $(uname -m); date +%T" style="margin:8px 0"><button class="btn" id="aSync"></button><pre class="out" id="aSyncO"></pre></div>
  <div class="card"><h2>executeShellAsync(script, callback, env)</h2><div class="sub" id="aAsyncD"></div>
    <input type="text" id="aAsyncIn" value='for i in 1 2 3; do echo "tick $i - $NAME"; sleep 1; done; echo oops >&2' style="margin:8px 0"><button class="btn" id="aAsync"></button><pre class="out" id="aAsyncO"></pre></div>
  <div class="card"><h2>extractAssets(path)</h2><div class="sub" id="aExD"></div>
    <input type="text" id="aExIn" value="home/etc/demo" style="margin:8px 0"><button class="btn" id="aEx"></button><pre class="out" id="aExO"></pre></div>
  <div class="card"><h2>fileChooser(callback)</h2><div class="sub" id="aFcD"></div><button class="btn" id="aFc" style="margin-top:8px"></button><pre class="out" id="aFcO"></pre></div>
  <div class="card"><h2 id="aTomlT"></h2><pre class="out" id="aToml">[[page]]
title = "Web workflow"
html  = "file:///android_asset/home/etc/demo/web_workflow.html"</pre></div>
</div>

<div class="dock" id="dock"><button class="btn p" id="run"></button><button class="btn d" id="cancel" disabled></button></div>

<script>
/* ---------- i18n ---------- */
var VI=(navigator.language||'').toLowerCase().indexOf('vi')===0;
var T=VI?{
 real:'Đang chạy trong app: lệnh được thực thi bằng shell thật qua KrScriptCore.',
 mock:'Chế độ giả lập (không có KrScriptCore, đây là trình duyệt thường). Mở trang này trong app để chạy shell thật.',
 tabW:'Workflow',tabA:'API cầu nối',ready:'Sẵn sàng chạy',run:'▶ Chạy',again:'↻ Chạy lại',cancel:'■ Dừng',
 running:'Đang chạy…',queueing:'Đang xếp lịch…',doing:'Đang chạy: ',done:'Hoàn tất',failed:'Thất bại',stopped:'Đã dừng',
 allOk:'Tất cả job thành công',errs:function(a,b){return a+' job lỗi, '+b+' job bị bỏ qua'},skipRest:'Các job còn lại bị bỏ qua',
 par:'⇉ Song song',seq:'↓ Tuần tự',oFail:'Cố tình làm lỗi bước "Kiểm tra" của Tải gói B',oFF:'fail-fast: một job lỗi thì dừng các job khác',
 pick:'Chọn tệp…',noFile:'(chưa chọn tệp, biến $FILE trống)',needs:'needs: ',first:'chạy đầu tiên',jobsSteps:function(a,b){return a+' job · '+b+' bước'},
 stopNote:'Đã dừng (tiến trình đang chạy trên máy vẫn kết thúc nốt).',noExit:'Không nhận được mã thoát',timeout:'Quá thời gian',cantStart:'Không khởi chạy được tiến trình',
 aRootD:'Trả về true/false: thiết bị có root không.',aSyncD:'Chạy đồng bộ, trả về toàn bộ kết quả (chặn giao diện cho tới khi xong, chỉ nên dùng lệnh ngắn).',
 aAsyncD:'Chạy không đồng bộ, nhận từng dòng stdout/stderr và mã thoát qua hàm callback. env là JSON biến môi trường.',
 aExD:'Giải nén tài nguyên trong assets ra thư mục làm việc, trả về đường dẫn.',aFcD:'Mở bộ chọn tệp của app, callback nhận {absPath}.',
 exec:'Chạy',aTomlT:'Mở trang này từ toml'
}:{
 real:'Running inside the app: commands run on a real shell through KrScriptCore.',
 mock:'Simulation mode (no KrScriptCore, this is a normal browser). Open this page inside the app to run a real shell.',
 tabW:'Workflow',tabA:'Bridge API',ready:'Ready to run',run:'▶ Run',again:'↻ Run again',cancel:'■ Stop',
 running:'Running…',queueing:'Scheduling…',doing:'Running: ',done:'Completed',failed:'Failed',stopped:'Stopped',
 allOk:'All jobs succeeded',errs:function(a,b){return a+' job(s) failed, '+b+' skipped'},skipRest:'Remaining jobs were skipped',
 par:'⇉ Parallel',seq:'↓ Sequential',oFail:'Make the "Verify" step of Package B fail on purpose',oFF:'fail-fast: stop other jobs when one fails',
 pick:'Choose file…',noFile:'(no file chosen, $FILE is empty)',needs:'needs: ',first:'runs first',jobsSteps:function(a,b){return a+' jobs · '+b+' steps'},
 stopNote:'Stopped (the process already running on the device finishes on its own).',noExit:'No exit code received',timeout:'Timed out',cantStart:'Could not start the process',
 aRootD:'Returns true/false: whether the device is rooted.',aSyncD:'Runs synchronously and returns the whole output (blocks the UI until done, use short commands only).',
 aAsyncD:'Runs asynchronously; stdout/stderr lines and the exit code arrive through a callback. env is a JSON of environment variables.',
 aExD:'Extracts an assets resource to the working folder and returns its path.',aFcD:'Opens the app file chooser; the callback receives {absPath}.',
 exec:'Run',aTomlT:'Open this page from toml'
};

/* ---------- định nghĩa workflow (tương đương [[workflow]] trong toml) ---------- */
var JOBS=[
 {id:'prepare',name:VI?'Chuẩn bị':'Prepare',needs:[],steps:[
  {n:VI?'Thông tin thiết bị':'Device info',run:'echo "user: $(id -un)"; echo "kernel: $(uname -sr)"; echo "arch: $(uname -m)"; echo "mode: $MODE"',mock:['user: root','kernel: Linux 6.1','arch: aarch64','mode: fast'],ms:700},
  {n:VI?'Dung lượng /data':'/data usage',run:'df -h /data | tail -n 1',mock:['/dev/block/dm-8  110G  41G  69G  38% /data'],ms:500}]},
 {id:'build-a',name:VI?'Tải gói A':'Package A',needs:['prepare'],steps:[
  {n:VI?'Tạo dữ liệu':'Generate data',run:'for i in 1 2 3; do echo "A: $i/3"; sleep 1; done',mock:['A: 1/3','A: 2/3','A: 3/3'],ms:2400},
  {n:VI?'Kiểm tra':'Verify',run:'echo "A ok"',mock:['A ok'],ms:300}]},
 {id:'build-b',name:VI?'Tải gói B':'Package B',needs:['prepare'],steps:[
  {n:VI?'Tạo dữ liệu':'Generate data',run:'for i in 1 2; do echo "B: $i/2"; sleep 1; done',mock:['B: 1/2','B: 2/2'],ms:1800},
  {n:VI?'Kiểm tra':'Verify',id:'verifyB',run:'echo "B ok"',mock:['B ok'],ms:400}]},
 {id:'install',name:VI?'Cài đặt':'Install',needs:['build-a','build-b'],steps:[
  {n:VI?'Đọc tệp đã chọn':'Read chosen file',run:'if [ -n "$FILE" ]; then ls -l "$FILE"; else echo "(FILE trống)"; fi',mock:['(FILE trống)'],ms:400},
  {n:VI?'Ghi tệp tạm':'Write temp file',run:'f="${TMPDIR:-/data/local/tmp}/kr_web_wf.txt"; echo "hello $(date +%T)" > "$f" && cat "$f" && rm -f "$f"',mock:['hello 12:00:00'],ms:500}]},
 {id:'report',name:VI?'Báo cáo':'Report',needs:['install'],steps:[
  {n:VI?'In kết quả':'Print summary',run:'echo "workflow finished at $(date +%T)"',mock:['workflow finished at 12:00:01'],ms:300}]}
];

/* ---------- cầu nối với app ---------- */
var Core=(typeof KrScriptCore!=='undefined')?KrScriptCore:null;
var seq=0;
function runShell(script,env,onLine){ // trả Promise {ok,code,note}
  return new Promise(function(resolve){
    if(!Core){return mockShell(script,env,onLine,resolve)}
    var name='krcb_'+(++seq),code=null,finished=false;
    function done(res){if(finished)return;finished=true;try{delete window[name]}catch(e){window[name]=null}resolve(res)}
    window[name]=function(m){
      if(m.type===2||m.type===4){
        String(m.message).split('\n').forEach(function(l){
          if(l==='')return;
          var mm=/@@KR_EXIT:(\d+)/.exec(l);
          if(mm){code=parseInt(mm[1],10);return}
          onLine(l,m.type===4);
        });
      }else if(m.type===-2){
        setTimeout(function(){done(code===null?{ok:false,code:-1,note:T.noExit}:{ok:code===0,code:code})},300);
      }
    };
    var body='( set -e\n'+script+'\n)\necho "@@KR_EXIT:$?"';
    var started=false;
    try{started=Core.executeShellAsync(body,name,JSON.stringify(env||{}))}catch(e){onLine(String(e),true)}
    if(!started)done({ok:false,code:-1,note:T.cantStart});
  });
}
function mockShell(script,env,onLine,resolve){
  var step=runShell.cur||{},lines=step.mock||['(mock)'],i=0,per=Math.max(120,(step.ms||600)/Math.max(1,lines.length));
  if(step.fail){lines=['verify: FAILED']}
  (function tick(){
    if(i<lines.length){onLine(lines[i++],false);setTimeout(tick,per)}
    else resolve({ok:!step.fail,code:step.fail?1:0});
  })();
}

/* ---------- trạng thái và giao diện ---------- */
function $(s){return document.querySelector(s)}
var IC={wait:'',queue:'◔',running:'<span>◜</span>',ok:'✓',err:'✕',skip:'–'};
var S={},mode='parallel',timer=null,startAt=0,cancelAll=false,runId=0,filePath='',finished=null;
var openJobs={},openSteps={};
var total=JOBS.reduce(function(a,j){return a+j.steps.length},0);
function reset(){S={};JOBS.forEach(function(j){S[j.id]={s:'wait',t:0,abort:false,steps:j.steps.map(function(){return{s:'wait',t:0,log:[]}})}});finished=null}
function ic(s){return '<div class="ic" data-s="'+s+'">'+(s==='wait'?'':IC[s])+'</div>'}
function tm(x){return(x.s==='wait'||x.s==='skip'||x.s==='queue')?'':(x.t/1000).toFixed(1)+'s'}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  var keep={};document.querySelectorAll('[data-k]').forEach(function(e){keep[e.dataset.k]=e.scrollTop});
  var h='';
  JOBS.forEach(function(j){
    var st=S[j.id];
    h+='<div class="job'+(openJobs[j.id]?' open':'')+'" data-s="'+st.s+'"><div class="hd" data-job="'+j.id+'">'+ic(st.s)+'<div class="n"><b>'+j.name+'</b><small>'+(j.needs.length?T.needs+j.needs.join(', '):T.first)+'</small></div><span class="time">'+tm(st)+'</span><span class="chev">›</span></div><div class="jb">';
    j.steps.forEach(function(sp,i){
      var x=st.steps[i],k=j.id+i;
      h+='<div class="sc'+(openSteps[k]?' open':'')+'"><div class="sh" data-step="'+k+'">'+ic(x.s)+'<div class="n"><b>'+sp.n+'</b><small class="mono">'+esc(sp.run.split('\n')[0])+'</small></div><span class="time">'+tm(x)+'</span></div><div class="log" data-k="'+k+'">'+x.log.map(function(l){return '<div class="'+(l.e?'e':(l.m?'m':''))+'">'+esc(l.t)+'</div>'}).join('')+'</div></div>';
    });
    h+='</div></div>';
  });
  $('#jobs').innerHTML=h;
  document.querySelectorAll('[data-k]').forEach(function(e){if(keep[e.dataset.k]!=null)e.scrollTop=keep[e.dataset.k]});
  // tổng quan
  var done=0;JOBS.forEach(function(j){S[j.id].steps.forEach(function(x){if(x.s==='ok'||x.s==='err'||x.s==='skip')done++})});
  $('#sBar').style.width=(done/total*100)+'%';
  var ic1='▶',t=T.ready,d=T.jobsSteps(JOBS.length,total),c='';
  if(timer){ic1='◜';t=T.running;var r=JOBS.filter(function(j){return S[j.id].s==='running'});d=r.length?T.doing+r.map(function(j){return j.name}).join(' + '):T.queueing}
  else if(finished){ic1=finished[0];t=finished[1];d=finished[2];c=finished[3]}
  $('#sIc').textContent=ic1;$('#sIc').style.color=c;$('#sT').textContent=t;$('#sD').textContent=d;
  $('#sTime').textContent=(timer?(performance.now()-startAt)/1000:(finished?finished[4]:0)).toFixed(1)+'s';
}
$('#jobs').onclick=function(e){
  var s=e.target.closest('[data-step]');if(s){openSteps[s.dataset.step]=!openSteps[s.dataset.step];return render()}
  var j=e.target.closest('[data-job]');if(j){openJobs[j.dataset.job]=!openJobs[j.dataset.job];render()}
};

/* ---------- chạy một job / cả workflow ---------- */
function withTimeout(p,ms,id){return Promise.race([p,new Promise(function(r){setTimeout(function(){r({ok:false,code:-1,note:T.timeout})},ms)})])}
async function runJob(j,id){
  var st=S[j.id],t0=performance.now(),ok=true;
  st.s='running';openJobs[j.id]=true;
  var tick=setInterval(function(){st.t=performance.now()-t0;st.steps.forEach(function(x){if(x.s==='running')x.t=performance.now()-x.t0})},150);
  for(var i=0;i<j.steps.length;i++){
    var sp=j.steps[i],x=st.steps[i];
    if(!ok){x.s='skip';continue}
    x.s='running';x.t0=performance.now();x.log.push({t:'$ '+sp.run.split('\n')[0],m:true});
    var script=sp.run;
    var fail=$('#oFail').checked&&sp.id==='verifyB';
    if(fail)script='echo "verify: FAILED" >&2; false';
    runShell.cur={mock:sp.mock,ms:sp.ms,fail:fail};
    var res=await withTimeout(runShell(script,{MODE:'fast',FILE:filePath,NAME:j.name},function(l,isErr){x.log.push({t:l,e:isErr})}),sp.timeout||60000);
    if(id!==runId)return;
    x.t=performance.now()-x.t0;
    if(cancelAll||st.abort){x.s='err';x.log.push({t:T.stopNote,e:true});ok=false;break}
    if(res.ok)x.s='ok';else{x.s='err';x.log.push({t:'exit '+res.code+(res.note?' - '+res.note:''),e:true});ok=false}
  }
  clearInterval(tick);st.t=performance.now()-t0;st.s=ok?'ok':'err';if(ok)openJobs[j.id]=false;
}
async function runAll(){
  var id=++runId;reset();cancelAll=false;startAt=performance.now();openJobs={};openSteps={};
  $('#run').disabled=true;$('#cancel').disabled=false;
  timer=setInterval(render,150);render();
  var running={},nRun=0,maxPar=mode==='parallel'?1e9:1,ff=$('#oFF').checked;
  while(id===runId){
    JOBS.forEach(function(j){var st=S[j.id];if(st.s!=='wait'&&st.s!=='queue')return;
      if(cancelAll||j.needs.some(function(n){return S[n].s==='err'||S[n].s==='skip'})){st.s='skip';st.steps.forEach(function(x){x.s='skip'})}});
    JOBS.forEach(function(j){var st=S[j.id];if(st.s!=='wait'&&st.s!=='queue')return;
      if(!j.needs.every(function(n){return S[n].s==='ok'}))return;
      if(nRun<maxPar){nRun++;running[j.id]=1;runJob(j,id).then(function(){nRun--;delete running[j.id];
        if(S[j.id].s==='err'&&ff)JOBS.forEach(function(o){var so=S[o.id];if(so.s==='running')so.abort=true;else if(so.s==='wait'||so.s==='queue'){so.s='skip';so.steps.forEach(function(x){x.s='skip'})}})})}
      else st.s='queue'});
    if(nRun===0&&JOBS.every(function(j){var s=S[j.id].s;return s==='ok'||s==='err'||s==='skip'}))break;
    await new Promise(function(r){setTimeout(r,100)});
  }
  if(id!==runId)return;
  clearInterval(timer);timer=null;
  var tot=(performance.now()-startAt)/1000,errs=JOBS.filter(function(j){return S[j.id].s==='err'}).length,sk=JOBS.filter(function(j){return S[j.id].s==='skip'}).length;
  finished=cancelAll?['■',T.stopped,T.skipRest,'var(--warn)',tot]:errs?['✕',T.failed,T.errs(errs,sk),'var(--err)',tot]:['✓',T.done,T.allOk,'var(--ok)',tot];
  $('#run').textContent=T.again;$('#run').disabled=false;$('#cancel').disabled=true;render();
}
$('#run').onclick=runAll;$('#cancel').onclick=function(){cancelAll=true};
$('#mPar').onclick=function(){if(timer)return;mode='parallel';$('#mPar').classList.add('on');$('#mSeq').classList.remove('on')};
$('#mSeq').onclick=function(){if(timer)return;mode='sequential';$('#mSeq').classList.add('on');$('#mPar').classList.remove('on')};
function chooseFile(cb){
  if(Core){window.krcb_pick=function(r){cb(r&&r.absPath||'')};if(!Core.fileChooser('krcb_pick'))cb('')}
  else cb('/sdcard/Download/sample.zip (mock)');
}
$('#pick').onclick=function(){chooseFile(function(p){filePath=p;$('#pickPath').textContent=p||T.noFile})};

/* ---------- tab API ---------- */
function out(id,t,append){var e=$(id);e.textContent=append?e.textContent+t:t;e.scrollTop=e.scrollHeight}
$('#aRoot').onclick=function(){out('#aRootO',String(Core?Core.rootCheck():'(mock) true'))};
$('#aSync').onclick=function(){var s=$('#aSyncIn').value;out('#aSyncO',Core?Core.executeShell(s):'(mock) root @ aarch64; 12:00:00')};
$('#aAsync').onclick=function(){
  out('#aAsyncO','');var s=$('#aAsyncIn').value;
  if(!Core){var n=0,iv=setInterval(function(){out('#aAsyncO','[out] tick '+(++n)+' - demo\n',true);if(n===3){clearInterval(iv);out('#aAsyncO','[err] oops\n[exit] 0',true)}},700);return}
  window.krcb_demo=function(m){out('#aAsyncO',(m.type===4?'[err] ':m.type===-2?'[exit] ':'[out] ')+m.message,true)};
  if(!Core.executeShellAsync(s,'krcb_demo',JSON.stringify({NAME:'demo'})))out('#aAsyncO',T.cantStart)
};
$('#aEx').onclick=function(){out('#aExO',Core?String(Core.extractAssets($('#aExIn').value)):'(mock) /data/user/0/app/files/home/etc/demo')};
$('#aFc').onclick=function(){chooseFile(function(p){out('#aFcO',JSON.stringify({absPath:p||null}))})};

/* ---------- tab và khởi tạo ---------- */
function showTab(w){$('#paneW').classList.toggle('hidden',!w);$('#paneA').classList.toggle('hidden',w);$('#dock').classList.toggle('hidden',!w);$('#tabW').classList.toggle('on',w);$('#tabA').classList.toggle('on',!w)}
$('#tabW').onclick=function(){showTab(true)};$('#tabA').onclick=function(){showTab(false)};
$('#banner').textContent=Core?T.real:T.mock;$('#banner').className='banner '+(Core?'real':'mock');
$('#tabW').textContent=T.tabW;$('#tabA').textContent=T.tabA;$('#run').textContent=T.run;$('#cancel').textContent=T.cancel;
$('#mPar').textContent=T.par;$('#mSeq').textContent=T.seq;$('#oFailT').textContent=T.oFail;$('#oFFT').textContent=T.oFF;$('#pick').textContent=T.pick;$('#pickPath').textContent=T.noFile;
['aRootD','aSyncD','aAsyncD','aExD','aFcD'].forEach(function(k){$('#'+k).textContent=T[k]});
['aRoot','aSync','aAsync','aEx','aFc'].forEach(function(k){$('#'+k).textContent=T.exec});$('#aTomlT').textContent=T.aTomlT;
reset();render();
</script>
</body>
</html>
