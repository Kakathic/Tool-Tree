# app/src/main/assets/home/etc/demo/switch.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[group]]
title = "@sw_001"
[[switch]]
title = "@sw_002"
desc = "@sw_003"
get = "glog demo_switch_basic"
set = 'slog demo_switch_basic "$state"'
[[switch]]
title = "@sw_004"
desc = "@sw_005"
set = 'echo "state = $state"'
[[switch]]
title = "@sw_006"
desc = "@sw_007"
get = "echo 1"

[[group]]
title = "@sw_008"
[[switch]]
title = "@sw_009"
get = "glog demo_switch_log"
set = '''
slog demo_switch_log "$state"
echo "@sw_010"
'''
[[switch]]
title = "auto-off"
desc = "@act_019"
auto-off = true
get = "glog demo_switch_auto"
set = '''
slog demo_switch_auto "$state"
echo "@act_020"
'''
[[switch]]
title = "shell = bg-task"
desc = "@sw_011"
shell = "bg-task"
get = "glog demo_switch_bg"
set = 'slog demo_switch_bg "$state"'

[[group]]
title = "@sw_012"
[[switch]]
title = "confirm"
desc = "@sw_013"
confirm = true
get = "glog demo_switch_confirm"
set = 'slog demo_switch_confirm "$state"'
[[switch]]
title = "lock"
lock = "@sw_014"
get = "echo 1"
[[switch]]
title = "reload-page"
desc = "@sw_015"
reload-page = true
get = "glog demo_switch_reload"
set = 'slog demo_switch_reload "$state"'

[[group]]
title = "@sw_016"
[[switch]]
title = "@sw_017"
get = "glog demo_switch_rows"
set = 'slog demo_switch_rows "$state"'
[[switch.rows]]
text = "@sw_018"
italic = true
size = 12
[[switch.rows]]
sh = "echo @sw_019 $(glog demo_switch_rows)"
size = 12
