# app/src/main/assets/home/etc/demo/download.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[text]]
title = "@path_toml"
[[text.rows]]
sh = 'echo "${PAGE_CONFIG_FILE:-$ETC/demo/download.toml}"'
monospace = true
size = 11
alpha = 0.7
copy = true
[[text.rows]]
line = true

[[group]]
title = "@dl_001"
[[download]]
title = "@dl_002"
desc = "@dl_003"
url = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
script = '''
echo "@dl_004"
ls -l "$state"
'''
[[download]]
title = "url-sh"
desc = "@dl_005"
url-sh = 'echo "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"'
script = 'echo "@dl_006"'

[[group]]
title = "@dl_007"
[[download]]
title = "@dl_008"
desc = "@dl_009"
confirm = true
warn = "@dl_010"
url = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
script = 'echo "@dl_006"'
[[download]]
title = "auto-off"
desc = "@dl_011"
auto-off = true
url = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
script = 'echo "Done"'
[[download]]
title = "lock"
lock = "@dl_012"
url = "https://example.com/file.zip"

[[group]]
title = "@dl_013"
[[download]]
title = "@dl_014"
url = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
script = 'echo "@dl_006"'
[[download.rows]]
text = "@dl_015"
