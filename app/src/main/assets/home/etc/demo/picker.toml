# app/src/main/assets/home/etc/demo/picker.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[text]]
[[text.rows]]
sh = 'echo "${PAGE_CONFIG_FILE:-$ETC/demo/picker.toml}"'
monospace = true
size = 11
alpha = 0.7
copy = true
[[text.rows]]
line = true

[[group]]
title = "@pk_001"
[[picker]]
title = "@prm_028"
desc = "@pk_002"
get = "glog demo_picker_opt"
set = 'slog demo_picker_opt "$state"; echo "@pk_003"'
[[picker.options]]
title = "@prm_031"
value = "performance"
[[picker.options]]
title = "@prm_032"
value = "balanced"
[[picker.options]]
title = "@prm_033"
value = "powersave"
[[picker]]
title = "@prm_034"
desc = "@pk_004"
items = ["vi|Tiếng Việt", "en|English", "ru|Русский", "fr"]
get = "glog demo_picker_items"
set = 'slog demo_picker_items "$state"; echo "@pk_003"'
[[picker]]
title = "option-sh"
desc = "@prm_036"
option-sh = '''
for n in 1 2 3 4 5; do
  echo "@pk_005"
done
'''
get = "glog demo_picker_sh"
set = 'slog demo_picker_sh "$state"; echo "@pk_003"'

[[group]]
title = "@pk_006"
[[picker]]
title = "multiple = true"
desc = "@pk_007"
multiple = true
separator = ","
items = ["@prm_044", "@prm_045", "@prm_046", "@prm_047"]
get = "glog demo_picker_multi"
set = 'slog demo_picker_multi "$state"; echo "@pk_003"'

[[group]]
title = "@dep_039"
[[picker]]
title = "confirm"
confirm = true
items = ["@pk_008", "@pk_009"]
get = "glog demo_picker_confirm"
set = 'slog demo_picker_confirm "$state"; echo "@pk_003"'
[[picker]]
title = "bg-task"
desc = "@sw_011"
shell = "bg-task"
items = ["@pk_008", "@pk_009"]
get = "glog demo_picker_bg"
set = 'slog demo_picker_bg "$state"'
[[picker]]
title = "lock"
lock = "@pk_010"
items = ["@pk_008"]
[[picker]]
title = "@pk_011"
items = ["@pk_008", "@pk_009"]
get = "glog demo_picker_rows"
set = 'slog demo_picker_rows "$state"'
[[picker.rows]]
text = "@pk_012"
italic = true
size = 12
