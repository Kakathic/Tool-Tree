# app/src/main/assets/home/etc/demo/terminal.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[text]]
[[text.rows]]
sh = 'echo "${PAGE_CONFIG_FILE:-$ETC/demo/terminal.toml}"'
monospace = true
size = 11
alpha = 0.7
copy = true
[[text.rows]]
line = true

[[group]]
title = "@tm_001"
[[terminal]]
title = "@tm_002"
desc = "@tm_003"
cwd = "{HOME}"
[[terminal]]
title = "@tm_004"
desc = "@tm_005"
cmd = "ip addr"
font-size = 12

[[group]]
title = "@tm_006"
[[terminal]]
title = "close-on-exit"
desc = "@tm_007"
cmd = "echo @tm_008; sleep 1"
close-on-exit = true
[[terminal]]
title = "exit-on-back"
desc = "@tm_009"
cmd = "echo @tm_010"
exit-on-back = true

[[group]]
title = "@tm_011"
[[terminal]]
title = "@tm_012"
desc = "@tm_013"
cwd = "{PAGE_CONFIG_DIR}"
cmd = "ls -la"
[[terminal]]
title = "root = false"
desc = "@tm_014"
root = false
cmd = "id"

[[group]]
title = "@tm_015"
[[terminal]]
title = "keep-screen-on"
desc = "@tm_016"
keep-screen-on = true
cmd = "echo @tm_017"
