[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[group]]
title = "@prm_001"
[[action]]
title = "text, int, number, password"
desc = "@prm_002"
script = '''
echo "user_name = $user_name"
echo "age = $age"
echo "factor = $factor"
echo "@prm_003"
'''
[[action.params]]
name = "user_name"
title = "@act_037"
label = "@prm_004"
desc = "@prm_005"
type = "text"
value = "Tool-Tree"
placeholder = "@prm_006"
required = true
maxlength = 30
[[action.params]]
name = "age"
title = "@prm_007"
type = "int"
min = 1
max = 120
value = "18"
[[action.params]]
name = "factor"
title = "@prm_008"
type = "number"
placeholder = "@prm_009"
[[action.params]]
name = "password"
title = "@prm_010"
type = "password"
placeholder = "@prm_011"

[[group]]
title = "@prm_012"
[[action]]
title = "max-lines"
desc = "@prm_013"
script = 'echo "$notes"'
[[action.params]]
name = "notes"
title = "@prm_014"
type = "text"
max-lines = 5
placeholder = "@prm_015"

[[group]]
title = "@prm_016"
[[action]]
title = "bool, checkbox, switch"
desc = "@prm_017"
script = '''
echo "agree = $agree"
echo "run_bg = $run_bg"
echo "auto_on = $auto_on"
'''
[[action.params]]
name = "agree"
title = "@prm_018"
type = "checkbox"
value = "1"
desc = "@prm_019"
desc-on = "@prm_020"
[[action.params]]
name = "run_bg"
title = "@prm_021"
type = "bool"
value = "0"
[[action.params]]
name = "auto_on"
title = "@prm_022"
type = "switch"
value = "1"
desc = "@prm_023"
desc-on = "@prm_024"

[[group]]
title = "@prm_025"
[[action]]
title = "seekbar"
script = 'echo "brightness = $brightness"'
[[action.params]]
name = "brightness"
title = "@prm_026"
type = "seekbar"
min = 0
max = 100
value = "40"

[[group]]
title = "@prm_027"
[[action]]
title = "@prm_028"
desc = "@prm_029"
script = 'echo "cpu = $cpu"'
[[action.params]]
name = "cpu"
title = "@prm_030"
type = "spinner"
value = "balanced"
[[action.params.options]]
title = "@prm_031"
value = "performance"
[[action.params.options]]
title = "@prm_032"
value = "balanced"
[[action.params.options]]
title = "@prm_033"
value = "powersave"
[[action]]
title = "@prm_034"
script = 'echo "lang_sel = $lang_sel"'
[[action.params]]
name = "lang_sel"
title = "@prm_035"
type = "single-select"
items = ["vi|Tiếng Việt", "en|English", "ru|Русский"]
value = "vi"
[[action]]
title = "options-sh, editable, allow-no-selection"
script = 'echo "list_item = $list_item / typed = $typed"'
[[action.params]]
name = "list_item"
title = "@prm_036"
type = "spinner"
options-sh = '''
echo "@prm_037"
echo "@prm_038"
echo "@prm_039"
'''
allow-no-selection = true
[[action.params]]
name = "typed"
title = "@prm_040"
type = "spinner"
editable = true
items = ["abc", "xyz"]

[[group]]
title = "@prm_041"
[[action]]
title = "multi-select"
desc = "@prm_042"
script = 'echo "features = $features"'
[[action.params]]
name = "features"
title = "@prm_043"
type = "multi-select"
multiple = true
separator = ","
value = ["a", "c"]
items = ["@prm_044", "@prm_045", "@prm_046", "@prm_047"]

[[group]]
title = "@prm_048"
[[action]]
title = "file, folder"
script = '''
echo "pick_file = $pick_file"
echo "pick_folder = $pick_folder"
echo "typed_path = $typed_path"
'''
[[action.params]]
name = "pick_file"
title = "@prm_049"
type = "file"
suffix = "zip,apk"
path-home = "/sdcard"
[[action.params]]
name = "pick_folder"
title = "@prm_050"
type = "folder"
path-home = "/sdcard"
[[action.params]]
name = "typed_path"
title = "@prm_051"
type = "file"
editable = true
[[action]]
title = "app, packages"
script = 'echo "apps = $apps"'
[[action.params]]
name = "apps"
title = "@prm_052"
type = "app"
multiple = true
separator = ","

[[group]]
title = "@prm_053"
[[action]]
title = "color"
script = 'echo "color = $color"'
[[action.params]]
name = "color"
title = "@prm_054"
type = "color"
value = "#0DBDA2"

[[group]]
title = "@prm_055"
[[action]]
title = "value-sh, placeholder-sh, label-sh, desc-sh, title-sh"
script = 'echo "clock = $clock"'
[[action.params]]
name = "clock"
title-sh = 'echo "@prm_056"'
label-sh = 'echo "@prm_057"'
desc-sh = 'echo "@prm_058"'
placeholder-sh = 'echo "@prm_059"'
type = "text"
value-sh = 'date +%H:%M:%S'
[[action]]
title = "remember"
desc = "@prm_060"
script = 'echo "remembered = $remembered"'
[[action.params]]
name = "remembered"
title = "@prm_061"
type = "text"
remember = true
[[action]]
title = "remember = false"
script = 'echo "not_remembered = $not_remembered"'
[[action.params]]
name = "not_remembered"
title = "@prm_062"
type = "text"
value = "@prm_063"
remember = false

[[group]]
title = "@prm_064"
[[action]]
title = "@prm_065"
desc = "@prm_066"
script = 'echo "a = $a_edit / b = $b_locked"'
[[action.params]]
name = "b_locked"
title = "@prm_067"
type = "text"
value = "@prm_068"
readonly = true
sort = true
[[action.params]]
name = "a_edit"
title = "@prm_069"
type = "text"
value = "@prm_070"
[[action]]
title = "@prm_071"
desc = "@prm_072"
script = 'echo "@prm_073"'
[[action.params]]
name = "step1"
title = "@prm_074"
type = "text"
value = "@prm_075"
apply = 'echo "@prm_076"'
[[action.params]]
name = "step2"
title = "@prm_077"
type = "text"
value = "hai"
apply = 'echo "@prm_078"'

[[group]]
title = "@prm_079"
[[action]]
title = "type = rows"
desc = "@prm_080"
script = 'echo "api_key = $api_key"'
[[action.params]]
type = "rows"
bg-color = "#1A2196F3"
stroke-color = "#552196F3"
radius = 12
padding = 12
[[action.params.rows]]
text = "@prm_081"
bold = true
[[action.params.rows]]
text = "@prm_082"
size = 12
break = true
[[action.params]]
name = "api_key"
title = "@prm_083"
type = "password"
[[action.params]]
type = "rows"
[[action.params.rows]]
text = "@prm_084"
size = 12
[[action.params.rows]]
line = true
