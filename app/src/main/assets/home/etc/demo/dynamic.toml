# app/src/main/assets/home/etc/demo/dynamic.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[group]]
title = "@dyn_001"
[[action]]
title-sh = 'echo "@dyn_002"'
desc-sh = 'echo "@dyn_003"'
summary-sh = 'echo "@dyn_004"'
script = 'echo ok'
[[action]]
title = "icon-sh"
icon-sh = 'echo "{ICON}/info.png"'
script = 'echo ok'
[[action]]
title = "lock-sh"
desc = "@act_056"
lock-sh = 'echo 0'
script = 'echo "@dyn_005"'

[[group]]
title = "@dyn_006"
[[action]]
title = "support = shell"
desc = "@dyn_007"
support = 'echo 1'
script = 'echo ok'
[[action]]
title = "@dyn_008"
desc = "{ROT} @dyn_009"
support = "[ {ROT} = 1 ] && echo 1"
script = 'echo "@dyn_010"'
[[action]]
title = "@dyn_011"
desc = "@dyn_012 {LOT}"
lock = "{LOT}|@dyn_013"
script = 'echo "@dyn_014"'

[[group]]
title = "@dyn_015"
[[action]]
title = "@dyn_016"
desc = "load-after = true"
load-after = true
title-sh = 'sleep 1; echo "@dyn_017"'
script = 'echo ok'

[[group]]
title = "@dyn_018"
[[text]]
[[text.rows]]
text = "Root: {ROT} @dyn_019"
[[text.rows]]
text = "@dyn_020 {LOT}"
break = true
[[text.rows]]
text = "@dyn_021 {TEXT_ROOT}"
break = true

[[end]]

[[text]]
[[text.rows]]
text = "@dyn_022"
size = 12
alpha = 0.85
[[text.rows]]
line = true
