[[group]]
title = "Ẩn/hiện theo một tham số"
[[action]]
title = "depend-on, depend-value"
desc = "Chọn chế độ để hiện đúng ô nhập tương ứng"
script = '''
echo "che_do = $che_do"
echo "tep_nguon = $tep_nguon"
echo "thu_muc_dich = $thu_muc_dich"
'''
[[action.params]]
name = "che_do"
title = "Chế độ sao lưu"
type = "spinner"
value = "file"
items = ["file|Một tệp", "folder|Cả thư mục"]
[[action.params]]
name = "tep_nguon"
title = "Tệp nguồn"
type = "file"
depend-on = "che_do"
depend-value = "file"
[[action.params]]
name = "thu_muc_dich"
title = "Thư mục đích"
type = "folder"
depend-on = "che_do"
depend-value = "folder"

[[action]]
title = "depend-mode = hide"
desc = "Ẩn khi giá trị khớp"
script = 'echo "tat = $tat / ghi_chu = $ghi_chu"'
[[action.params]]
name = "tat"
title = "Tắt ghi chú"
type = "switch"
value = "0"
[[action.params]]
name = "ghi_chu"
title = "Ghi chú"
type = "text"
depend-on = "tat"
depend-value = "1"
depend-mode = "hide"

[[group]]
title = "Mờ và khoá thay vì ẩn"
[[action]]
title = "depend-readonly, depend-sort"
desc = "Khi không khớp, ô chỉ bị mờ và khoá"
script = 'echo "cho_phep = $cho_phep / gia_tri = $gia_tri"'
[[action.params]]
name = "cho_phep"
title = "Cho phép sửa"
type = "switch"
value = "0"
[[action.params]]
name = "gia_tri"
title = "Giá trị"
type = "text"
value = "abc"
depend-on = "cho_phep"
depend-value = "1"
depend-readonly = true
depend-sort = true

[[group]]
title = "Nhiều tham số cha (depend-logic)"
[[action]]
title = "and (mặc định)"
desc = "Cần cả hai công tắc đều bật"
script = 'echo ok'
[[action.params]]
name = "and_a"
title = "Điều kiện A"
type = "switch"
value = "0"
[[action.params]]
name = "and_b"
title = "Điều kiện B"
type = "switch"
value = "0"
[[action.params]]
name = "and_kq"
title = "Hiện khi A và B cùng bật"
type = "text"
depend-on = "and_a|and_b"
depend-value = "1|1"
[[action]]
title = "or / priority"
desc = "Chỉ cần một điều kiện khớp"
script = 'echo ok'
[[action.params]]
name = "or_a"
title = "Điều kiện A"
type = "switch"
value = "0"
[[action.params]]
name = "or_b"
title = "Điều kiện B"
type = "switch"
value = "0"
[[action.params]]
name = "or_kq"
title = "Hiện khi A hoặc B bật"
type = "text"
depend-on = "or_a|or_b"
depend-value = "1|1"
depend-logic = "or"
depend-default = "hide"
[[action]]
title = "xor"
desc = "Đúng một điều kiện khớp"
script = 'echo ok'
[[action.params]]
name = "xor_a"
title = "Điều kiện A"
type = "switch"
value = "0"
[[action.params]]
name = "xor_b"
title = "Điều kiện B"
type = "switch"
value = "0"
[[action.params]]
name = "xor_kq"
title = "Hiện khi chỉ một trong hai bật"
type = "text"
depend-on = "xor_a|xor_b"
depend-value = "1|1"
depend-logic = "xor"
[[action]]
title = "nand"
desc = "Ẩn khi cả hai cùng khớp"
script = 'echo ok'
[[action.params]]
name = "nand_a"
title = "Điều kiện A"
type = "switch"
value = "0"
[[action.params]]
name = "nand_b"
title = "Điều kiện B"
type = "switch"
value = "0"
[[action.params]]
name = "nand_kq"
title = "Hiện trừ khi A và B cùng bật"
type = "text"
depend-on = "nand_a|nand_b"
depend-value = "1|1"
depend-logic = "nand"
[[action]]
title = "depend-threshold"
desc = "Cần ít nhất 67% điều kiện khớp (2 trên 3)"
script = 'echo ok'
[[action.params]]
name = "th_a"
title = "Điều kiện A"
type = "switch"
value = "0"
[[action.params]]
name = "th_b"
title = "Điều kiện B"
type = "switch"
value = "0"
[[action.params]]
name = "th_c"
title = "Điều kiện C"
type = "switch"
value = "0"
[[action.params]]
name = "th_kq"
title = "Hiện khi ít nhất hai điều kiện bật"
type = "text"
depend-on = "th_a|th_b|th_c"
depend-value = "1|1|1"
depend-threshold = 67

[[group]]
title = "Giá trị khớp nhiều lựa chọn"
[[action]]
title = "depend-value có dấu phẩy"
desc = "Hiện khi chọn b hoặc c, hỗ trợ ký tự đại diện"
script = 'echo ok'
[[action.params]]
name = "loai"
title = "Loại"
type = "spinner"
value = "a"
items = ["a|Loại A", "b|Loại B", "c|Loại C", "dd1|Loại DD1"]
[[action.params]]
name = "loai_bc"
title = "Chỉ hiện với B hoặc C"
type = "text"
depend-on = "loai"
depend-value = "b,c"
[[action.params]]
name = "loai_dd"
title = "Khớp mẫu dd*"
type = "text"
depend-on = "loai"
depend-value = "dd*"

[[group]]
title = "Tuỳ chọn khác"
[[action]]
title = "depend-negate, depend-initial, depend-cascade"
script = 'echo "an = $an_chua / hien = $hien_con"'
[[action.params]]
name = "goc"
title = "Công tắc gốc"
type = "switch"
value = "1"
[[action.params]]
name = "dao"
title = "depend-negate: hiện khi gốc TẮT"
type = "text"
depend-on = "goc"
depend-value = "1"
depend-negate = true
depend-initial = "hide"
[[action.params]]
name = "cha"
title = "Tham số cha (hiện khi gốc bật)"
type = "switch"
value = "1"
depend-on = "goc"
depend-value = "1"
[[action.params]]
name = "hien_con"
title = "Con: ẩn theo cha (depend-cascade)"
type = "text"
depend-on = "cha"
depend-value = "1"
depend-cascade = true
[[action.params]]
name = "an_chua"
title = "Ẩn nhưng vẫn gửi giá trị"
type = "text"
value = "vẫn gửi"
depend-on = "goc"
depend-value = "1"
depend-include-hidden = true
[[action]]
title = "depend-onchange"
desc = "Chạy script mỗi khi trạng thái hiện/ẩn đổi"
script = 'echo ok'
[[action.params]]
name = "oc_goc"
title = "Công tắc"
type = "switch"
value = "0"
[[action.params]]
name = "oc_con"
title = "Ô theo dõi"
type = "text"
depend-on = "oc_goc"
depend-value = "1"
depend-onchange = 'slog demo_depend_change "$PARAM_NAME=$PARAM_VISIBLE"'
