# app/src/main/assets/home/etc/demo/depend.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[group]]
title = "@path_toml"
[[text]]
[[text.rows]]
sh = 'echo "${PAGE_CONFIG_FILE:-$ETC/demo/depend.toml}"'
monospace = true
size = 11
alpha = 0.7
copy = true

[[group]]
title = "#1 @dep_001"
[[action]]
title = "depend-on, depend-value"
desc = "@dep_002"
script = '''
echo "mode_choice = $mode_choice"
echo "src_file = $src_file"
echo "dest_folder = $dest_folder"
'''
[[action.params]]
name = "mode_choice"
title = "@dep_003"
type = "spinner"
value = "file"
items = ["@dep_004", "@dep_005"]
[[action.params]]
name = "src_file"
title = "@dep_006"
type = "file"
depend-on = "mode_choice"
depend-value = "file"
[[action.params]]
name = "dest_folder"
title = "@dep_007"
type = "folder"
depend-on = "mode_choice"
depend-value = "folder"

[[action]]
title = "depend-mode = hide"
desc = "@dep_008"
script = 'echo "disable_notes = $disable_notes / notes = $notes"'
[[action.params]]
name = "disable_notes"
title = "@dep_009"
type = "switch"
value = "0"
[[action.params]]
name = "notes"
title = "@prm_014"
type = "text"
depend-on = "disable_notes"
depend-value = "1"
depend-mode = "hide"

[[group]]
title = "#2 @dep_010"
[[action]]
title = "depend-readonly, depend-sort"
desc = "@dep_011"
script = 'echo "allow = $allow / val_field = $val_field"'
[[action.params]]
name = "val_field"
title = "@dep_013"
type = "text"
value = "abc"
depend-on = "allow"
depend-value = "1"
depend-readonly = true
depend-sort = true
[[action.params]]
name = "allow"
title = "@dep_012"
type = "switch"
value = "0"
depend-sort = true

[[group]]
title = "#3 @dep_014"
[[action]]
title = "@dep_015"
desc = "@dep_016"
script = 'echo ok'
[[action.params]]
name = "and_a"
title = "@dep_017"
type = "switch"
value = "0"
[[action.params]]
name = "and_b"
title = "@dep_018"
type = "switch"
value = "0"
[[action.params]]
name = "and_result"
title = "@dep_019"
type = "text"
depend-on = "and_a|and_b"
depend-value = "1|1"
[[action]]
title = "or / priority"
desc = "@dep_020"
script = 'echo ok'
[[action.params]]
name = "or_a"
title = "@dep_017"
type = "switch"
value = "0"
[[action.params]]
name = "or_b"
title = "@dep_018"
type = "switch"
value = "0"
[[action.params]]
name = "or_result"
title = "@dep_021"
type = "text"
depend-on = "or_a|or_b"
depend-value = "1|1"
depend-logic = "or"
depend-default = "hide"
[[action]]
title = "xor"
desc = "@dep_022"
script = 'echo ok'
[[action.params]]
name = "xor_a"
title = "@dep_017"
type = "switch"
value = "0"
[[action.params]]
name = "xor_b"
title = "@dep_018"
type = "switch"
value = "0"
[[action.params]]
name = "xor_result"
title = "@dep_023"
type = "text"
depend-on = "xor_a|xor_b"
depend-value = "1|1"
depend-logic = "xor"
[[action]]
title = "nand"
desc = "@dep_024"
script = 'echo ok'
[[action.params]]
name = "nand_a"
title = "@dep_017"
type = "switch"
value = "0"
[[action.params]]
name = "nand_b"
title = "@dep_018"
type = "switch"
value = "0"
[[action.params]]
name = "nand_result"
title = "@dep_025"
type = "text"
depend-on = "nand_a|nand_b"
depend-value = "1|1"
depend-logic = "nand"
[[action]]
title = "depend-threshold"
desc = "@dep_026"
script = 'echo ok'
[[action.params]]
name = "th_a"
title = "@dep_017"
type = "switch"
value = "0"
[[action.params]]
name = "th_b"
title = "@dep_018"
type = "switch"
value = "0"
[[action.params]]
name = "th_c"
title = "@dep_027"
type = "switch"
value = "0"
[[action.params]]
name = "th_result"
title = "@dep_028"
type = "text"
depend-on = "th_a|th_b|th_c"
depend-value = "1|1|1"
depend-threshold = 67

[[group]]
title = "#4 @dep_029"
[[action]]
title = "@dep_030"
desc = "@dep_031"
script = 'echo ok'
[[action.params]]
name = "type_sel"
title = "@dep_032"
type = "spinner"
value = "a"
items = ["@dep_033", "@dep_034", "@dep_035", "@dep_036"]
[[action.params]]
name = "type_bc"
title = "@dep_037"
type = "text"
depend-on = "type_sel"
depend-value = "b,c"
[[action.params]]
name = "type_dd"
title = "@dep_038"
type = "text"
depend-on = "type_sel"
depend-value = "dd*"

[[group]]
title = "#5 @dep_039"
[[action]]
title = "depend-negate, depend-initial, depend-cascade"
script = 'echo "an = $hidden_sent / hien = $child_text"'
[[action.params]]
name = "root_sw"
title = "@dep_040"
type = "switch"
value = "1"
[[action.params]]
name = "inverse"
title = "@dep_041"
type = "text"
depend-on = "root_sw"
depend-value = "1"
depend-negate = true
depend-initial = "hide"
[[action.params]]
name = "parent"
title = "@dep_042"
type = "switch"
value = "1"
depend-on = "root_sw"
depend-value = "1"
[[action.params]]
name = "child_text"
title = "@dep_043"
type = "text"
depend-on = "parent"
depend-value = "1"
depend-cascade = true
[[action.params]]
name = "hidden_sent"
title = "@dep_044"
type = "text"
value = "@dep_045"
depend-on = "root_sw"
depend-value = "1"
depend-include-hidden = true
[[action]]
title = "depend-onchange"
desc = "@dep_046"
script = 'echo ok'
[[action.params]]
name = "oc_goc"
title = "@prm_022"
type = "switch"
value = "0"
[[action.params]]
name = "oc_con"
title = "@dep_047"
type = "text"
depend-on = "oc_goc"
depend-value = "1"
depend-onchange = 'slog demo_depend_change "$PARAM_NAME=$PARAM_VISIBLE"'
