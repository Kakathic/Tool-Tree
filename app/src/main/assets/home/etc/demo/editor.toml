# app/src/main/assets/home/etc/demo/editor.toml
[[toml]]
load-key-sh = 'ETC="$ETC/demo" langpath'

[[group]]
title = "@ed_001"
[[editor]]
title = "@ed_002"
desc = "@ed_003"
file = "{HOME}/demo_files/notes.txt"
placeholder = "@ed_004"
value = "@ed_005\n@ed_006"
run = false
[[editor]]
title = "@ed_007"
desc = "@ed_008"
file = "{HOME}/demo_files/hello.sh"
value = '''#!/system/bin/sh
echo "@ed_009"
date
'''
[[editor]]
title = "@ed_010"
desc = "@ed_011"
file = "{HOME}/demo_files/input.sh"
need-input = true
value = '''#!/system/bin/sh
echo "@ed_012"
read user_name
echo "@act_027"
'''

[[group]]
title = "@ed_013"
[[editor]]
title = "@ed_014"
desc = "@ed_015"
file = "{HOME}/demo_files/test_page.toml"
placeholder = "[[toml]]"
value = '''# toml
[[group]]
title = "@ed_016"
[[switch]]
title = "@ed_017"
get = "glog demo_editor_page_sw"
set = 'slog demo_editor_page_sw "$state"'
[[action]]
title = "@ed_018"
script = 'echo "@ed_019"'
'''

[[group]]
title = "@ed_020"
[[editor]]
title = "wrap = false"
desc = "@ed_021"
file = "{HOME}/demo_files/long.txt"
wrap = false
run = false
value = "@ed_022"
[[editor]]
title = "readonly = true"
desc = "@ed_023"
file = "{HOME}/demo_files/notes.txt"
readonly = true
run = false
[[editor]]
title = "@ed_024"
desc = "@act_056"
file = "{HOME}/demo_files/notes.txt"
readonly = "echo 1"
run = false
[[editor]]
title = "file-sh"
desc = "@ed_025"
file-sh = 'echo "$HOME/demo_files/notes.txt"'
run = false
[[editor]]
title = "value-sh"
desc = "@ed_026"
file = "{HOME}/demo_files/created_at.txt"
value-sh = "date '+@ed_027 %H:%M:%S @ed_028 %d/%m/%Y'"
run = false

[[group]]
title = "@ed_029"
[[editor]]
title = "@ed_030"
file = "{HOME}/demo_files/notes.txt"
run = false
[[editor.rows]]
text = "@ed_031"
italic = true
size = 12
